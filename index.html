<!DOCTYPE html>
<html lang="en">

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>VITANA Platform</title>
    <meta name="description" content="Join MAXINA to discover and create amazing events, connect with communities, and grow together." />
    <meta name="author" content="MAXINA" />

    <!-- Default OG tags - overwritten by SEO component on specific pages -->
    <meta property="og:site_name" content="MAXINA" />
    <meta property="og:title" content="MAXINA - Longevity Community" />
    <meta property="og:description" content="Discover events and connect with the longevity community" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://inmkhvwdcuyhnxkgfvsb.supabase.co/storage/v1/object/public/covers/vitana-og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MAXINA - Longevity Community" />
    <meta name="twitter:description" content="Discover events and connect with the longevity community" />
    <meta name="twitter:image" content="https://inmkhvwdcuyhnxkgfvsb.supabase.co/storage/v1/object/public/covers/vitana-og-default.jpg" />

    <!-- Editorial display font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500&display=swap">

    <!-- Warm the gateway TCP+TLS handshake before the deferred orb-widget script
         and the first /auth/me call. Saves ~150-300ms of cold-load time on mobile.
         Cloudflare-fronted custom domain — bypasses the *.a.run.app GFE per-IP
         throttle (BOOTSTRAP-CLOUDFLARE-GATEWAY-DOMAIN). -->
    <link rel="preconnect" href="%VITE_GATEWAY_BASE%" crossorigin>
    <link rel="dns-prefetch" href="%VITE_GATEWAY_BASE%">

    <!-- Warm the Supabase handshake too: storage serves every event/post cover
         image (no-CORS pool, no crossorigin) and supabase-js hits auth/REST on
         boot (CORS pool, crossorigin) — both save one DNS+TCP+TLS round-trip. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%">
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin>
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%">

    <!-- ORB Voice Widget -->
    <!-- BOOTSTRAP-ORB-STAGING-GATEWAY: load the widget from THIS environment's
         gateway via %VITE_GATEWAY_BASE% (Vite bakes it at build:
         gateway.vitanaland.com on prod — identical to before — and
         preview-gateway.vitanaland.com on staging). The widget auto-detects its
         gateway from its own script src, so loading it from prod on the preview
         frontend made the orb call prod (rejected by the prod origin gate) and
         the orb stayed silent. Loading it from the env's own gateway keeps the
         whole voice flow (widget JS + session + SSE) within one environment.
         The widget lives in the gateway repo
         (services/gateway/src/frontend/command-hub/orb-widget.js); the ?v= bump
         forces browsers to refetch instead of serving the cached prod widget. -->
    <script src="%VITE_GATEWAY_BASE%/command-hub/orb-widget.js?v=20260811-de-speed" defer></script>
  </head>

  <body>
    <script>
      // Early FCM token detection for Appilix WebView
      (function() {
        try {
          // 1. Check URL params (?fcm_token=...)
          var params = new URLSearchParams(window.location.search);
          var urlToken = params.get('fcm_token');
          if (urlToken) {
            window.appilix_fcm_token = urlToken;
            console.log('[Appilix-Early] FCM token from URL param');
          }
          // 2. Listen for custom event from Appilix Custom JS
          document.addEventListener('appilix:fcm_token', function(e) {
            if (e.detail) {
              window.appilix_fcm_token = e.detail;
              console.log('[Appilix-Early] FCM token from custom event');
            }
          });
          // 3. Early push identity from cookie (before React hydration)
          var m = document.cookie.match(/appilix_push_notification_user_identity=([^;]+)/);
          if (m && m[1]) {
            window.appilix_push_notification_user_identity = m[1];
            console.log('[Appilix-Early] Push identity set from cookie:', m[1]);
            // Register identity with native shell using documented format
            if (window.appilix && window.appilix.postMessage) {
              window.appilix.postMessage(JSON.stringify({
                type: "firebase_record_user_identity",
                props: { user_identity: m[1] }
              }));
              console.log('[Appilix-Early] Identity registered with native shell:', m[1]);
            }
          } else {
            console.log('[Appilix-Early] No push identity cookie found');
          }
        } catch(e) {
          console.warn('[Appilix-Early] Init error:', e);
        }
      })();
    </script>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
