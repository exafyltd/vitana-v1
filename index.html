    <!-- Warm the gateway TCP+TLS handshake before the deferred orb-widget script
         and the first /auth/me call. Saves ~150-300ms of cold-load time on mobile. -->
    <link rel="preconnect" href="https://gateway-q74ibpv6ia-uc.a.run.app" crossorigin>
    <link rel="dns-prefetch" href="https://gateway-q74ibpv6ia-uc.a.run.app">

    <!-- ORB Voice Widget -->

  <body>
    <script>
      // Early FCM token detection for Appilix WebView
      (function() {
        try {
          // 1. Check URL params (?fcm_token=...)
          var params = new URLSearchParams(window.location.search);
          var urlToken = params.get('fcm_token');
          if (urlToken) {
            window.appilix_fcm_token = urlToken;
            console.log('[Appilix-Early] FCM token from URL param');
          }
          // 2. Listen for custom event from Appilix Custom JS
          document.addEventListener('appilix:fcm_token', function(e) {
            if (e.detail) {
              window.appilix_fcm_token = e.detail;
              console.log('[Appilix-Early] FCM token from custom event');
            }
          });
          // 3. Early push identity from cookie (before React hydration)
          var m = document.cookie.match(/appilix_push_notification_user_identity=([^;]+)/);
          if (m && m[1]) {
            window.appilix_push_notification_user_identity = m[1];
            console.log('[Appilix-Early] Push identity set from cookie:', m[1]);
            // Register identity with native shell using documented format
            if (window.appilix && window.appilix.postMessage) {
              window.appilix.postMessage(JSON.stringify({
                type: "firebase_record_user_identity",
                props: { user_identity: m[1] }
              }));
              console.log('[Appilix-Early] Identity registered with native shell:', m[1]);
            }
          } else {
            console.log('[Appilix-Early] No push identity cookie found');
          }
        } catch(e) {
          console.warn('[Appilix-Early] Init error:', e);
        }
      })();
    </script>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
