server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Apple Universal Links association file
    location /.well-known/apple-app-site-association {
        default_type application/json;
    }

    # Static assets — long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Download flyer — crawler split (same idea as the vitanaland-og-proxy
    # worker for /events/*): link-preview bots get the static OG page so
    # shared invite links unfurl as a rich card; humans get the SPA.
    location = /download {
        if ($http_user_agent ~* "(facebookexternalhit|whatsapp|twitterbot|telegrambot|linkedinbot|slackbot|discordbot|pinterest|vkshare|skypeuripreview|viber)") {
            rewrite ^ /og-download.html last;
        }
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /og-download.html {
        add_header Cache-Control "no-cache" always;
    }

    # index.html must never be cached — each deploy changes chunk hashes.
    # Without this, Appilix WebView serves a stale index.html that references
    # old JS chunks, causing lazy-load crashes ("Something went wrong").
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # SPA fallback — serve index.html for all routes
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
