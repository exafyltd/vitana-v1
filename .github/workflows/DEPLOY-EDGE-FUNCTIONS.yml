name: Deploy Supabase Edge Functions

# Deploys changed Supabase edge functions on push to main.
# Manual dispatch can target a single function or "all".
#
# Required secrets:
#   SUPABASE_ACCESS_TOKEN  - personal access token from
#                            https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   - project ref (e.g. inmkhvwdcuyhnxkgfvsb)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      function:
        description: 'Function to deploy (name only, or "all")'
        required: true
        default: 'all'
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Determine functions to deploy
        id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT='${{ inputs.function }}'
            if [ "$INPUT" = "all" ] || [ -z "$INPUT" ]; then
              FUNCS=$(ls supabase/functions | tr '\n' ' ')
            else
              FUNCS="$INPUT"
            fi
          else
            # Push event: deploy only functions whose files changed in this push.
            BEFORE='${{ github.event.before }}'
            AFTER='${{ github.sha }}'
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              FUNCS=$(ls supabase/functions | tr '\n' ' ')
            else
              FUNCS=$(git diff --name-only "$BEFORE" "$AFTER" -- 'supabase/functions/**' \
                | awk -F/ '{print $3}' \
                | sort -u \
                | tr '\n' ' ')
            fi
          fi
          FUNCS=$(echo "$FUNCS" | xargs)
          echo "Deploying: ${FUNCS:-<none>}"
          echo "funcs=$FUNCS" >> "$GITHUB_OUTPUT"

      - name: Deploy functions
        if: steps.pick.outputs.funcs != ''
        run: |
          set -euo pipefail
          for fn in ${{ steps.pick.outputs.funcs }}; do
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "Skipping $fn (directory missing)"
              continue
            fi
            echo "::group::Deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
