name: UNIT-TESTS
# BOOTSTRAP-TEST-COVERAGE: the routine that runs the frontend unit-test
# suite (Vitest + Testing Library, configured in vitest.config.ts).
# Before this workflow the repo had no unit tests and no runner at all.
#
# Triggers: every PR, every push to main, nightly cron, manual dispatch.
# Build-out schedule for the missing coverage: docs/TEST_COVERAGE_PLAN.md
# (this repo) + the master plan in vitana-platform/docs/TEST_COVERAGE_PLAN.md.

run-name: 'Unit Tests (${{ github.event_name }} on ${{ github.ref_name }})'

on:
  pull_request: {}
  push:
    branches: [ main ]
  schedule:
    # Nightly stability run — 03:47 UTC
    - cron: '47 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: unit-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vitest:
    name: Vitest (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  # VTID-05023 (Aurora cutover, part 5): every edge function builds its
  # supabase-js client through supabase/functions/_shared/data-client.ts, and
  # that helper routes /rest/v1 to DATA_API_URL with no silent fallback.
  edge-data-client:
    name: Edge data client (guard + Deno tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: No direct createClient in edge functions
        run: node scripts/check-edge-data-client.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno tests for the edge data client
        run: deno test --no-remote supabase/functions/_shared/data-client.test.ts

  # VTID-05023 (Aurora cutover, part 7a): every realtime channel in src/ goes
  # through src/integrations/supabase/realtime.ts, so VITE_REALTIME_URL moves
  # all of them to the self-hosted Realtime server at once (no split).
  realtime-helper:
    name: Realtime helper (guard + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: No direct realtime channel calls in src/
        run: node scripts/check-realtime-helper.mjs
      - name: Install
        run: npm ci
      - name: Vitest for the realtime helper
        run: npx vitest run src/integrations/supabase/realtime.test.ts src/integrations/supabase/realtime.call-sites.test.ts
