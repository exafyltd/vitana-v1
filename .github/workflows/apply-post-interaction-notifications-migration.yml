name: Apply post interaction notifications migration

# Applies the like/comment author-notification triggers
# (supabase/migrations/20260623000000_post_interaction_notifications.sql) to the
# live Supabase project using the Management API query endpoint and the existing
# SUPABASE_ACCESS_TOKEN secret — no DB password required. The SQL is idempotent
# (CREATE OR REPLACE FUNCTION / DROP TRIGGER IF EXISTS + CREATE TRIGGER), so the
# job is safe to re-run.
#
# There is a single Supabase project for both preview and prod frontends, so once
# applied the triggers create notifications for likes/comments on both hosts —
# no frontend deploy required.
#
# Triggers:
#   - Auto:   push to main that touches the migration file or this workflow.
#   - Manual: Actions tab -> "Run workflow".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260623000000_post_interaction_notifications.sql'
      - '.github/workflows/apply-post-interaction-notifications-migration.yml'

concurrency:
  group: apply-post-interaction-notifications-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: inmkhvwdcuyhnxkgfvsb
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1
          fi
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open('supabase/migrations/20260623000000_post_interaction_notifications.sql').read()
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          try:
              r = urllib.request.urlopen(req)
              print('Apply OK, status', r.status)
              print((r.read().decode() or '[]')[:1000])
          except urllib.error.HTTPError as e:
              print('Apply FAILED, HTTP', e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Verify the four triggers exist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = ("select count(*)::int as n from pg_trigger where tgname in "
                 "('trg_notify_profile_post_like','trg_notify_profile_post_comment',"
                 "'trg_notify_media_upload_like','trg_notify_media_upload_comment');")
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          r = urllib.request.urlopen(req)
          body = r.read().decode()
          print('Verify:', body)
          rows = json.loads(body or '[]')
          n = (rows[0] if rows else {}).get('n', 0)
          if n != 4:
              raise SystemExit(f"::error::Expected 4 triggers, found {n}")
          print('Verify OK: all 4 triggers present.')
          PY
