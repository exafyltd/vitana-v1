name: Apply community publish notifications migration

# Applies supabase/migrations/20260630000000... (notify_on_community_publish.sql)
# to the live Supabase project via the Management API query endpoint using the
# existing SUPABASE_ACCESS_TOKEN secret. Idempotent (CREATE OR REPLACE +
# DROP/CREATE TRIGGER), safe to re-run. Notifies the whole community (every other
# member of the author's tenant) when a public post or approved public video is
# published.
#
# Triggers:
#   - Auto:   push to main that touches the migration file or this workflow.
#   - Manual: Actions tab -> "Run workflow".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260630120000_notify_on_community_publish.sql'
      - '.github/workflows/apply-notify-on-community-publish-migration.yml'

concurrency:
  group: apply-notify-on-community-publish-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: inmkhvwdcuyhnxkgfvsb
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1
          fi
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open('supabase/migrations/20260630120000_notify_on_community_publish.sql').read()
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          try:
              r = urllib.request.urlopen(req)
              print('Apply OK, status', r.status)
              print((r.read().decode() or '[]')[:1000])
          except urllib.error.HTTPError as e:
              print('Apply FAILED, HTTP', e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Verify functions and triggers exist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']

          def query(sql):
              req = urllib.request.Request(
                  f'https://api.supabase.com/v1/projects/{ref}/database/query',
                  data=json.dumps({'query': sql}).encode(),
                  headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                           'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
                  method='POST',
              )
              return json.loads(urllib.request.urlopen(req).read().decode() or '[]')

          fns = query(
              "select count(*)::int as n from pg_proc where proname in "
              "('notify_community_on_public_post','notify_community_on_public_video');"
          )
          nf = (fns[0] if fns else {}).get('n', 0)
          print('Functions found:', nf)
          if nf != 2:
              raise SystemExit(f"::error::Expected 2 functions, found {nf}")

          trg = query(
              "select count(*)::int as n from pg_trigger where tgname in "
              "('trg_notify_community_post','trg_notify_community_video_ins',"
              "'trg_notify_community_video_upd') and not tgisinternal;"
          )
          nt = (trg[0] if trg else {}).get('n', 0)
          print('Triggers found:', nt)
          if nt != 3:
              raise SystemExit(f"::error::Expected 3 triggers, found {nt}")

          print('Verify OK: 2 functions + 3 triggers present.')
          PY
