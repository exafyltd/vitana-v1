name: Apply VTID-03319 phase2 feed-safety migration

# Applies supabase/migrations/20260622130000_vtid_03319_phase2_feed_safety.sql
# (per-user hide/mute/block tables + RLS) to the live Supabase project via the
# Management API query endpoint using the existing SUPABASE_ACCESS_TOKEN secret
# — no DB password required. The SQL is idempotent (CREATE TABLE IF NOT EXISTS /
# DROP POLICY IF EXISTS / CREATE POLICY), so the job is safe to re-run.
#
# Triggers:
#   - Auto:   push to main that touches the migration file or this workflow.
#   - Manual: Actions tab -> "Run workflow".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260622130000_vtid_03319_phase2_feed_safety.sql'
      - '.github/workflows/apply-vtid-03319-phase2-migration.yml'

concurrency:
  group: apply-vtid-03319-phase2-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: inmkhvwdcuyhnxkgfvsb
      MIGRATION: supabase/migrations/20260622130000_vtid_03319_phase2_feed_safety.sql
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1
          fi
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open(os.environ['MIGRATION']).read()
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          try:
              r = urllib.request.urlopen(req)
              print('Apply OK, status', r.status)
              print((r.read().decode() or '[]')[:1000])
          except urllib.error.HTTPError as e:
              print('Apply FAILED, HTTP', e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Verify tables + RLS exist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = (
              "select "
              "to_regclass('public.user_hidden_posts') is not null as hidden_exists, "
              "to_regclass('public.user_muted_authors') is not null as muted_exists, "
              "to_regclass('public.user_blocked_authors') is not null as blocked_exists, "
              "(select bool_and(relrowsecurity) from pg_class "
              " where relname in ('user_hidden_posts','user_muted_authors','user_blocked_authors')) as rls_enabled;"
          )
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          r = urllib.request.urlopen(req)
          body = r.read().decode()
          print('Verify:', body)
          rows = json.loads(body or '[]')
          row = rows[0] if rows else {}
          if not (row.get('hidden_exists') and row.get('muted_exists')
                  and row.get('blocked_exists') and row.get('rls_enabled')):
              raise SystemExit(f"::error::Migration did not fully take effect: {row}")
          print('Verify OK: all three tables present with RLS enabled.')
          PY
