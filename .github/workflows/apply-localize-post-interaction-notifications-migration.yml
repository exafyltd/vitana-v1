name: Apply localize post interaction notifications migration

# Applies the locale-aware like/comment notification triggers
# (supabase/migrations/20260624000000_localize_post_interaction_notifications.sql)
# to the live Supabase project via the Management API query endpoint and the
# existing SUPABASE_ACCESS_TOKEN secret. Idempotent (CREATE OR REPLACE only), so
# safe to re-run.
#
# Triggers:
#   - Auto:   push to main that touches the migration file or this workflow.
#   - Manual: Actions tab -> "Run workflow".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260624000000_localize_post_interaction_notifications.sql'
      - '.github/workflows/apply-localize-post-interaction-notifications-migration.yml'

concurrency:
  group: apply-localize-post-interaction-notifications-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: inmkhvwdcuyhnxkgfvsb
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1
          fi
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open('supabase/migrations/20260624000000_localize_post_interaction_notifications.sql').read()
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          try:
              r = urllib.request.urlopen(req)
              print('Apply OK, status', r.status)
              print((r.read().decode() or '[]')[:1000])
          except urllib.error.HTTPError as e:
              print('Apply FAILED, HTTP', e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Verify the functions are locale-aware
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = ("select "
                 "(select count(*)::int from pg_proc where proname='_notif_user_locale') as helper, "
                 "(select count(*)::int from pg_proc where proname in "
                 "('notify_on_profile_post_like','notify_on_media_upload_like',"
                 "'notify_on_profile_post_comment','notify_on_media_upload_comment') "
                 "and prosrc like '%v_locale%') as localized;")
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          r = urllib.request.urlopen(req)
          body = r.read().decode()
          print('Verify:', body)
          rows = json.loads(body or '[]')
          row = rows[0] if rows else {}
          if row.get('helper') != 1 or row.get('localized') != 4:
              raise SystemExit(f"::error::Localization not applied (helper={row.get('helper')}, localized={row.get('localized')})")
          print('Verify OK: helper present and all 4 functions locale-aware.')
          PY
