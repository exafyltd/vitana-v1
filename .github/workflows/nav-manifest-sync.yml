name: Nav Manifest → Gateway Sync

# VTID-02783: Whenever screens.manifest.ts changes on main, fire a sync PR
# against vitana-platform that regenerates the auto-managed catalog block.
# The opened PR is reviewed + merged like any other change — no auto-merge.

on:
  push:
    branches: [main]
    paths:
      - 'src/navigation/screens.manifest.ts'
      - 'src/navigation/screen-manifest-types.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-sync-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vitana-v1
        uses: actions/checkout@v4
        with:
          path: vitana-v1
          fetch-depth: 1

      - name: Checkout vitana-platform
        uses: actions/checkout@v4
        with:
          repository: exafyltd/vitana-platform
          token: ${{ secrets.VITANA_PLATFORM_PAT }}
          path: vitana-platform
          fetch-depth: 0
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install gateway deps + run nav:sync
        working-directory: vitana-platform/services/gateway
        env:
          VITANA_V1_REPO_PATH: ${{ github.workspace }}/vitana-v1
        run: |
          npm ci --no-audit --no-fund
          npm run nav:sync

      - name: Detect catalog changes
        id: diff
        working-directory: vitana-platform
        run: |
          if git diff --quiet -- services/gateway/src/lib/navigation-catalog.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[nav-sync] catalog already up to date — no PR needed"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- services/gateway/src/lib/navigation-catalog.ts
          fi

      - name: Create / update sync PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          path: vitana-platform
          token: ${{ secrets.VITANA_PLATFORM_PAT }}
          branch: nav-manifest-sync/auto
          base: main
          delete-branch: true
          commit-message: |
            chore(navigator): sync catalog from vitana-v1 manifest (VTID-02783)

            Auto-generated by .github/workflows/nav-manifest-sync.yml in vitana-v1
            in response to a manifest change on vitana-v1 main.

            Source commit: ${{ github.sha }}

            Co-Authored-By: nav-manifest-sync (vitana-v1) <noreply@vitana.dev>
          title: "chore(navigator): sync catalog from vitana-v1 manifest"
          body: |
            **Auto-generated** by `nav-manifest-sync.yml` in vitana-v1 because
            `screens.manifest.ts` changed.

            Source commit (vitana-v1): https://github.com/exafyltd/vitana-v1/commit/${{ github.sha }}

            Review:
            - [ ] Diff matches the manifest change in vitana-v1
            - [ ] No hand-edits inside the auto-managed block
            - [ ] CI green (incl. `nav:check`)
            - [ ] No unexpected screen_id collisions

            🤖 Auto-merge is intentionally OFF. A human approves before merge.
          labels: |
            navigator
            auto-generated
            VTID-02783
