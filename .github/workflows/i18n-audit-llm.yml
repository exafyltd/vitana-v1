name: i18n LLM audit

# Reviews translation quality across locales using a different LLM than the
# one that produced the translations. Two-phase: cheap static checks
# (placeholder integrity, length, brand preservation, HTML leak) + LLM
# semantic review on the rest.
#
# Per-language reports:
#   docs/i18n-audit-<locale>.md           (human summary)
#   src/i18n/<locale>/<shard>._audit.json (machine-readable verdicts)
#
# Trigger: workflow_dispatch only (manual, with locale + provider inputs).
# The nightly schedule was removed (i18n-audit-nightly-off): it ran on an
# out-of-quota Gemini key (HTTP 429 on almost every batch), still showed green,
# pushed 9 auto/i18n-audit-* branches a night that were never merged, and
# nothing from it reached main.
#
# Secrets needed (in repo Settings → Secrets):
#   DEEPSEEK_API_KEY       — default today; DeepSeek also translated, so
#                            correlated errors are possible (the script warns)
#   GOOGLE_GEMINI_API_KEY  — independent auditor, but currently out of quota
#   ANTHROPIC_API_KEY      — direct Anthropic API; that account has no credit
# Follow-up: a Bedrock (Claude) auditor, independent of the translator.

on:
  workflow_dispatch:
    inputs:
      locale:
        description: 'Target locale (de, sr, ar, es, ru, zh, fr, pt, pl)'
        required: true
        default: 'de'
      provider:
        description: 'Auditor LLM provider'
        required: true
        default: 'deepseek'
        type: choice
        options:
          - gemini
          - anthropic
          - deepseek
      shard:
        description: 'Single shard name (omit for all)'
        required: false
        default: ''
      threshold:
        description: 'Max % flagged before failing the run'
        required: false
        default: '10'
      resume:
        description: 'Skip keys already marked OK in _audit.json'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: i18n-audit-llm-${{ github.event.inputs.locale || 'all' }}
  cancel-in-progress: false

jobs:
  audit-single:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Run audit
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ARGS="--locale=${{ inputs.locale }} --provider=${{ inputs.provider }} --threshold=${{ inputs.threshold }}"
          if [ -n "${{ inputs.shard }}" ]; then
            ARGS="$ARGS --shard=${{ inputs.shard }}"
          fi
          if [ "${{ inputs.resume }}" = "true" ]; then
            ARGS="$ARGS --resume"
          fi
          echo "Running: node scripts/i18n-audit-llm.mjs $ARGS"
          set +e
          node scripts/i18n-audit-llm.mjs $ARGS
          AUDIT_EXIT=$?
          echo "audit_exit=$AUDIT_EXIT" >> $GITHUB_OUTPUT
          # Don't fail the step on audit exit 1 — we still want to commit the report
          exit 0

      - name: Commit audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first so new audit files (untracked) show up in the diff.
          # i18n-audit/ carries the MACHINE-READABLE verdicts that
          # scripts/apply-audit-suggestions.mjs consumes (VTID-03524). Staging
          # only src/i18n/ and docs/ left the markdown report committed and its
          # companion JSON discarded with the runner, so the documented
          # "apply the >=0.80 suggestions" step could never actually run — the
          # audit produced advice nothing could act on.
          git add src/i18n/ docs/ i18n-audit/
          if git diff --cached --quiet; then
            echo "No audit changes."
            exit 0
          fi
          git commit -m "chore(i18n): audit ${{ inputs.locale }} via ${{ inputs.provider }} (verdicts in docs/i18n-audit-${{ inputs.locale }}.md)"
          # Concurrent audits (e.g. two locales) can race the push; retry with rebase.
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${{ github.ref_name }} || true
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed — backing off"
            sleep $((5 * i))
          done
          echo "push failed after 5 attempts"
          exit 1
