name: Apply VTID-05133 ai_discoverable migration

# Applies supabase/migrations/20261013160000_vtid_05133_ai_discoverable.sql to
# the live Supabase project via the Management API query endpoint using the
# existing SUPABASE_ACCESS_TOKEN secret. Idempotent (ADD COLUMN IF NOT EXISTS),
# safe to re-run. Schema only: writes no rows (the column defaults to false,
# nobody is opted in).
#
# "Connect your AI": a member is shown to other members' connected AI
# assistants (gateway /mcp/community) only when profile_privacy_settings.
# ai_discoverable is true. Until this is applied the gateway shows nobody
# (fails closed) and the Settings switch stays disabled.
#
# Triggers:
#   - Manual only: Actions tab -> "Run workflow".

on:
  # VTID-04949 (plan D2): no push trigger. Merging must never apply SQL to the
  # production database; migrations ship at Gate 2, dispatched in order.
  workflow_dispatch:
concurrency:
  group: apply-vtid-05133-ai-discoverable-migration
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: inmkhvwdcuyhnxkgfvsb
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1
          fi
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open('supabase/migrations/20261013160000_vtid_05133_ai_discoverable.sql').read()
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          try:
              r = urllib.request.urlopen(req)
              print('Apply OK, status', r.status)
              print((r.read().decode() or '[]')[:1000])
          except urllib.error.HTTPError as e:
              print('Apply FAILED, HTTP', e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Verify the column (NOT NULL, default false, nobody opted in)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']

          def one(sql):
              req = urllib.request.Request(
                  f'https://api.supabase.com/v1/projects/{ref}/database/query',
                  data=json.dumps({'query': sql}).encode(),
                  headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                           'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
                  method='POST',
              )
              rows = json.loads(urllib.request.urlopen(req).read().decode() or '[]')
              return (rows[0] if rows else {}).get('n', 0)

          checks = {
              'column NOT NULL DEFAULT false': ("select count(*)::int as n from information_schema.columns where table_schema='public' "
                                                "and table_name='profile_privacy_settings' and column_name='ai_discoverable' "
                                                "and is_nullable='NO' and column_default='false'", 1),
          }
          bad = []
          for name, (sql, want) in checks.items():
              got = one(sql)
              print(f'{name}: {got} (want {want})')
              if got != want:
                  bad.append(name)
          if bad:
              raise SystemExit('::error::Verify failed: ' + ', '.join(bad))
          print('Verify OK')
          PY
