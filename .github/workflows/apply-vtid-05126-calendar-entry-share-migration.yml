name: Apply VTID-05126 calendar entry share migration

# Applies supabase/migrations/20261012120000_vtid_05126_profile_posts_calendar_entry_share.sql
# to the live Supabase project via the Management API query endpoint using the
# existing SUPABASE_ACCESS_TOKEN secret. Idempotent (ADD COLUMN IF NOT EXISTS,
# guarded constraints, IF NOT EXISTS indexes, CREATE OR REPLACE), safe to
# re-run. Schema only: writes no rows.
#
# Lets a post share any of the author's own calendar entries: attached_ref_type
# 'calendar_entry' plus profile_posts.attached_snapshot (the card: title,
# times, emoji, status, the place only if the author showed it), kept current
# by a trigger on calendar_events; the share notification names such a post by
# its card title. Event shares and plain posts are unchanged. Tested by
# SQL-CALENDAR-ENTRY-SHARE.yml. Dispatch BEFORE promoting the VTID-05126 app
# and gateway to production.
#
# Triggers:
#   - Auto:   push to main that touches the migration file or this workflow.
#   - Manual: Actions tab -> "Run workflow".

on:
  # VTID-04949 (plan D2): no push trigger. Merging must never apply SQL to the
  # production database; migrations ship at Gate 2, dispatched in order.
  workflow_dispatch:
concurrency:
  group: apply-vtid-05126-calendar-entry-share-migration
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: inmkhvwdcuyhnxkgfvsb
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1
          fi
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open('supabase/migrations/20261012120000_vtid_05126_profile_posts_calendar_entry_share.sql').read()
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          try:
              r = urllib.request.urlopen(req)
              print('Apply OK, status', r.status)
              print((r.read().decode() or '[]')[:1000])
          except urllib.error.HTTPError as e:
              print('Apply FAILED, HTTP', e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Verify snapshot column, constraints, sync triggers and notification branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']

          def one(sql):
              req = urllib.request.Request(
                  f'https://api.supabase.com/v1/projects/{ref}/database/query',
                  data=json.dumps({'query': sql}).encode(),
                  headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                           'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
                  method='POST',
              )
              rows = json.loads(urllib.request.urlopen(req).read().decode() or '[]')
              return (rows[0] if rows else {}).get('n', 0)

          checks = {
              'snapshot column': ("select count(*)::int as n from information_schema.columns where table_schema='public' "
                                  "and table_name='profile_posts' and column_name='attached_snapshot'", 1),
              'ref type check': ("select count(*)::int as n from pg_constraint where conname='profile_posts_attached_ref_type_check' "
                                 "and pg_get_constraintdef(oid) like '%calendar_entry%'", 1),
              'snapshot check': ("select count(*)::int as n from pg_constraint where conname='profile_posts_attached_snapshot_check'", 1),
              'sync triggers': ("select count(*)::int as n from pg_trigger where tgname in "
                                "('trg_calendar_events_sync_shared_snapshot','trg_calendar_events_sync_shared_snapshot_delete')", 2),
              'guard covers snapshot': ("select count(*)::int as n from pg_proc where proname='profile_posts_guard_attached_ref' "
                                        "and prosrc like '%attached_snapshot%'", 1),
              'notify branch': ("select count(*)::int as n from pg_proc where proname='notify_community_on_public_post' "
                                "and prosrc like '%calendar_entry%' and prosrc like '%shared a new post%'", 1),
          }
          bad = []
          for name, (sql, want) in checks.items():
              got = one(sql)
              print(f'{name}: {got} (want {want})')
              if got != want:
                  bad.append(name)
          if bad:
              raise SystemExit('::error::Verify failed: ' + ', '.join(bad))
          print('Verify OK')
          PY
