name: Apply VTID-04955 group participants policy migration

# Applies supabase/migrations/20261007160000_vtid_04955_group_creator_manage_participants.sql
# to the live Supabase project via the Management API query endpoint using the
# existing SUPABASE_ACCESS_TOKEN secret. Idempotent (DROP POLICY IF EXISTS +
# CREATE POLICY), safe to re-run. Schema only: writes no rows.
#
# Adds one permissive UPDATE policy on global_thread_participants so a group's
# creator can remove members (before, the update matched 0 rows silently and
# the app reported success). Tested by SQL-GROUP-PARTICIPANTS.yml.
#
# Triggers:
#   - Auto:   push to main that touches the migration file or this workflow.
#   - Manual: Actions tab -> "Run workflow".

on:
  # VTID-04949 (plan D2): no push trigger. Merging must never apply SQL to the
  # production database; migrations ship at Gate 2, dispatched in order.
  workflow_dispatch:
concurrency:
  group: apply-vtid-04955-group-participants-migration
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: inmkhvwdcuyhnxkgfvsb
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1
          fi
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open('supabase/migrations/20261007160000_vtid_04955_group_creator_manage_participants.sql').read()
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          try:
              r = urllib.request.urlopen(req)
              print('Apply OK, status', r.status)
              print((r.read().decode() or '[]')[:1000])
          except urllib.error.HTTPError as e:
              print('Apply FAILED, HTTP', e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Verify the policy exists
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = ("select count(*)::int as n from pg_policies where schemaname='public' "
                 "and tablename='global_thread_participants' and policyname='Thread creators can update participants' "
                 "and cmd='UPDATE'")
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          rows = json.loads(urllib.request.urlopen(req).read().decode() or '[]')
          n = (rows[0] if rows else {}).get('n', 0)
          print('policy present:', n)
          if n != 1:
              raise SystemExit('::error::Verify failed: policy missing')
          print('Verify OK')
          PY
