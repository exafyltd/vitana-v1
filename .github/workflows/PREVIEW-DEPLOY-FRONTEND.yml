# PREVIEW-DEPLOY-FRONTEND — per-PR preview of the community app, on S3 +
# CloudFront (VTID-03658).
#
# Replaces the Cloud Run implementation (`community-app-pr-<n>`), which died
# when GCP billing was deliberately disabled: every run failed with
# `BILLING_DISABLED` from Artifact Registry, so PRs shipped with no preview at
# all.
#
# WHY S3 AND NOT A PER-PR ECS SERVICE
# -----------------------------------
# The app is a static SPA — nginx in a container was never doing anything a CDN
# does not. The ECS route would need a task definition, service, target group
# AND an ALB listener rule per pull request, and listener-rule PRIORITY has
# already caused one silent misroute in this estate (CLAUDE.md §1b: the
# path-based rules at priority 10 match before higher-numbered host rules
# regardless of Host). Creating and destroying those per PR would invite that
# on a schedule. S3 prefixes have no ordering to get wrong.
#
# ONE-TIME SETUP: scripts/aws/setup-pr-previews.sh (bucket, SPA-fallback
# CloudFront function, scoped IAM). Requires the PREVIEW_CF_DISTRIBUTION_ID and
# PREVIEW_CF_DOMAIN repo secrets that script tells the operator to set. Until
# they exist this workflow fails FAST with a named reason rather than half
# deploying — see the preflight step.

name: Preview Deploy Frontend (per-PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/PREVIEW-DEPLOY-FRONTEND.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-deploy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-central-1
  PREVIEW_BUCKET: vitana-pr-previews
  PR_PREFIX: pr-${{ github.event.pull_request.number }}
  # Previews talk to the AWS STAGING gateway, never production. Vite bakes this
  # at build time — there is no runtime env var to correct it afterwards.
  STAGING_GATEWAY_URL: https://preview-aws-gateway.vitanaland.com

jobs:
  preview-deploy:
    # Forks cannot read repo secrets, so a fork PR would fail on AWS auth
    # rather than deploy anything. Skipping is the honest outcome.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — required secrets
        run: |
          missing=""
          [ -n "${{ secrets.PREVIEW_CF_DISTRIBUTION_ID }}" ] || missing="$missing PREVIEW_CF_DISTRIBUTION_ID"
          [ -n "${{ secrets.PREVIEW_CF_DOMAIN }}" ] || missing="$missing PREVIEW_CF_DOMAIN"
          [ -n "${{ secrets.AWS_STAGING_ACCESS_KEY_ID }}" ] || missing="$missing AWS_STAGING_ACCESS_KEY_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing — run scripts/aws/setup-pr-previews.sh and set them. Previews are unavailable until then."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Write .env.production (staging gateway, never prod)
        run: |
          # Same reasoning as AWS-STAGE-DEPLOY-FRONTEND.yml: only the gateway
          # URL is overridden. Supabase is deliberately left inherited from the
          # committed .env, because gateway-staging runs against the prod
          # Supabase project and a mismatched project makes every authed
          # feature silently degrade (CLAUDE.md / docs/STAGING.md §6).
          {
            echo "VITE_GATEWAY_BASE=${STAGING_GATEWAY_URL}"
            echo "VITE_GATEWAY_URL=${STAGING_GATEWAY_URL}/api/v1"
          } > .env.production
          cat .env.production

      - name: Build
        run: |
          # --base is load-bearing: the preview is served from /pr-<n>/, and
          # without it every asset URL would be absolute ("/assets/x.js") and
          # 404 against the CDN root. The symptom is a white page with a
          # working index.html, which reads like a broken build rather than a
          # broken path.
          npm run build -- --base=/${PR_PREFIX}/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_STAGING_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_STAGING_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          set -e
          # Hashed assets are immutable and safe to cache hard; index.html must
          # never be cached, or a pushed fix keeps serving the previous bundle
          # and the reviewer reviews the wrong code.
          aws s3 sync dist/ "s3://${PREVIEW_BUCKET}/${PR_PREFIX}/" \
            --delete \
            --exclude 'index.html' \
            --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp dist/index.html "s3://${PREVIEW_BUCKET}/${PR_PREFIX}/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate'

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.PREVIEW_CF_DISTRIBUTION_ID }}" \
            --paths "/${PR_PREFIX}/*" >/dev/null

      - name: Verify the preview actually serves this commit
        id: verify
        run: |
          set -e
          URL="https://${{ secrets.PREVIEW_CF_DOMAIN }}/${PR_PREFIX}/"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # A green sync is not evidence the CDN serves it. Poll until the
          # invalidation lands, and assert the shipped index references the
          # prefix — a 200 alone would also be returned by a stale object.
          for i in 1 2 3 4 5 6 7 8; do
            BODY=$(curl -fsS --max-time 20 "$URL" 2>/dev/null || echo '')
            if echo "$BODY" | grep -q "/${PR_PREFIX}/assets/"; then
              echo "Preview live and serving ${PR_PREFIX} assets"
              exit 0
            fi
            echo "attempt $i: not ready yet"; sleep 15
          done
          echo "::error::Preview did not serve ${PR_PREFIX} assets after 8 attempts"
          exit 1

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- preview-deploy-bot -->';
            const url = '${{ steps.verify.outputs.url }}';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `### 🔍 Preview deployed`,
              ``,
              `**URL:** ${url}`,
              `**Commit:** ${sha}`,
              ``,
              `_Static preview on S3 + CloudFront. Auto-deployed on every push to this PR; removed when it closes._`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
