# Per-PR preview deployments (independent staging per branch):
#
# Every open PR that touches frontend files gets its OWN Cloud Run service
# (community-app-pr-<number>), auto-deployed on every push and auto-deleted
# by PREVIEW-TEARDOWN-FRONTEND.yml when the PR closes. This exists because
# community-app-staging (STAGE-DEPLOY-FRONTEND.yml) is a single shared
# service — two branches manually redeploying it back-to-back clobber each
# other's verification. With this workflow, nobody should need to manually
# workflow_dispatch STAGE-DEPLOY-FRONTEND.yml against a feature branch again;
# every PR gets its own isolated, automatically-updating preview instead.
#
# Same build pattern as STAGE-DEPLOY-FRONTEND.yml (WIF auth, .env.production
# override, gcloud run deploy --source=.) so it stays consistent with that
# workflow. No custom preview.vitanaland.com subdomain is provisioned — the
# Cloud Run auto-generated *.run.app URL (posted as a PR comment) is enough
# to test a branch in isolation; the Cloudflare Worker that fronts
# preview.vitanaland.com has a static, hand-maintained route map and isn't
# meant for N dynamic hostnames (see vitana-platform docs/STAGING.md §0).

name: Preview Deploy Frontend (per-PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
      - '.github/workflows/PREVIEW-DEPLOY-FRONTEND.yml'

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: preview-deploy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GCP_PROJECT: lovable-vitana-vers1
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: community-app-pr-${{ github.event.pull_request.number }}
  STAGING_GATEWAY_URL: https://preview-gateway.vitanaland.com

jobs:
  preview-deploy:
    # Skip forks — they can't see repo secrets, so a fork PR would just fail
    # loudly on GCP auth instead of deploying anything.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}
          project_id: lovable-vitana-vers1

      - uses: google-github-actions/setup-gcloud@v2

      - name: Write .env.production with staging URLs
        run: |
          # Same override as STAGE-DEPLOY-FRONTEND.yml: only the gateway URL
          # points at staging. Supabase is left unset so the build inherits
          # the PROD project from the committed .env — gateway-staging itself
          # runs against prod Supabase (BOOTSTRAP-ORB-STAGING-SUPABASE-ALIGN),
          # so the frontend must authenticate against the same project or
          # authed features silently degrade. See docs/STAGING.md §6/§9b.
          cat > .env.production <<EOF
          # Generated by PREVIEW-DEPLOY-FRONTEND.yml — do not commit.
          VITE_GATEWAY_BASE=${STAGING_GATEWAY_URL}
          VITE_GATEWAY_URL=${STAGING_GATEWAY_URL}/api/v1
          EOF
          echo "wrote .env.production:"
          sed 's/=.*/=<value>/' .env.production

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --source=. \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT}" \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --update-env-vars=GIT_COMMIT_SHA=${{ github.event.pull_request.head.sha }},COMMIT_SHA=${{ github.event.pull_request.head.sha }},PR_NUMBER=${{ github.event.pull_request.number }} \
            --quiet

          URL=$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.url)')
          REV=$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.latestReadyRevisionName)')
          echo "deploy_url=$URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "Deployed: ${CLOUD_RUN_SERVICE}@${REV} → $URL"

      - name: Health check
        env:
          URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retry in 10s"
            sleep 10
          done
          echo "::error::Health check failed after 6 attempts"
          exit 1

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- preview-deploy-bot -->';
            const url = '${{ steps.deploy.outputs.deploy_url }}';
            const revision = '${{ steps.deploy.outputs.revision }}';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `### 🔍 Preview deployed`,
              ``,
              `**URL:** ${url}`,
              `**Revision:** ${revision}`,
              `**Commit:** ${sha}`,
              ``,
              `_Auto-deployed on every push to this PR; torn down when it closes._`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
