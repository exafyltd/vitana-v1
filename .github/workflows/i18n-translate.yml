name: i18n translate

# Drains _pending_review entries from src/i18n/<locale>/<shard>.json by
# translating from the corresponding src/i18n/en/<shard>.json via the chosen
# provider (Gemini default, DeepSeek fallback). Pushes the result back to the
# branch the workflow is dispatched against.
#
# Manual trigger:
#   gh workflow run i18n-translate.yml --ref VTID-i18n-toasts-cleanup \
#     -f provider=gemini -f locale=de
#
# Auto-trigger (Wave 6+): on push to main when a DE shard changes — opens an
# auto-PR with the diff.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Translation provider'
        required: true
        default: 'gemini'
        type: choice
        options:
          - gemini
          - deepseek
          - anthropic
      locale:
        description: 'Target locale (de, sr, ar, es, ru, zh, fr, pt, pl)'
        required: true
        default: 'de'
      shard:
        description: 'Shard name (omit for all)'
        required: false
        default: ''
      batch:
        description: 'Strings per API call'
        required: false
        default: '30'

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Keyed by LOCALE as well as ref (VTID-03509). Keying on the ref alone
  # serializes every locale on a branch, and GitHub keeps only ONE pending run
  # per group: dispatching fr/pt/ru/pl back-to-back left fr running, pl pending,
  # and SILENTLY CANCELLED pt and ru. `cancel-in-progress: false` does not
  # prevent that — it only protects the run that is already executing.
  #
  # Two runs for different locales never touch the same files (each writes only
  # src/i18n/<locale>/), and the push step below already rebases with retries,
  # so letting them run concurrently is safe and turns a multi-locale expansion
  # from hours of queueing into one pass.
  group: i18n-translate-${{ github.ref }}-${{ inputs.locale }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # continue-on-error so a PARTIAL failure still reaches the commit step.
      # translate-keys.mjs exits 1 if ANY key failed, and the script persists
      # after every batch — so without this, a run that translated 14,068 of
      # 14,160 keys discarded all 14,068 because the commit step never ran.
      # That is exactly what happened on the first fr/pt/ru/pl dispatch.
      - name: Run translator
        id: translate
        continue-on-error: true
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # --init bootstraps a new locale dir from en/ if missing; idempotent
          # for existing locales (only flags untranslated leaves).
          ARGS="--init --provider=${{ inputs.provider }} --locale=${{ inputs.locale }} --batch=${{ inputs.batch }}"
          if [ -n "${{ inputs.shard }}" ]; then
            ARGS="$ARGS --shard=${{ inputs.shard }}"
          fi
          echo "Running: node scripts/translate-keys.mjs $ARGS"
          node scripts/translate-keys.mjs $ARGS

      # always() so partial progress is committed even when the translator
      # reported failures. The script is idempotent and resumable — keys that
      # succeeded are written and cleared of _pending_review, so a re-run picks
      # up only what is left instead of paying for the whole locale again.
      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git diff --quiet` doesn't see new untracked files (a fresh locale dir from --init).
          # Stage everything first, then check the cached diff against HEAD.
          git add src/i18n/
          if git diff --cached --quiet; then
            echo "No translation changes."
            exit 0
          fi
          git commit -m "chore(i18n): drain _pending_review via ${{ inputs.provider }} for ${{ inputs.locale }} (actor=${{ github.actor }})"
          # Concurrent runs (e.g. two locales translated in parallel) can race
          # the push; rebase against the latest ref before retrying.
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${{ github.ref_name }} || true
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed — backing off"
            sleep $((5 * i))
          done
          echo "push failed after 5 attempts"
          exit 1

      # Report the translator's own verdict last, so a partial run is visibly
      # red (there is still work to do) without having cost us the work that
      # did succeed. Re-dispatch the same locale to drain the remainder.
      - name: Fail if the translator reported unfinished keys
        if: always() && steps.translate.outcome == 'failure'
        run: |
          echo "The translator exited non-zero: some keys were not translated."
          echo "Whatever succeeded has been committed and pushed above."
          echo "Re-dispatch this workflow for the same locale to drain the rest."
          exit 1
