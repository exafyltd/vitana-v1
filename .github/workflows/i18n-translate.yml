name: i18n translate

# Drains _pending_review entries from src/i18n/<locale>/<shard>.json by
# translating from the corresponding src/i18n/en/<shard>.json via the chosen
# provider (Gemini default, DeepSeek fallback). Pushes the result back to the
# branch the workflow is dispatched against.
#
# Manual trigger:
#   gh workflow run i18n-translate.yml --ref VTID-i18n-toasts-cleanup \
#     -f provider=gemini -f locale=de
#
# Auto-trigger (Wave 6+): on push to main when a DE shard changes — opens an
# auto-PR with the diff.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Translation provider'
        required: true
        default: 'gemini'
        type: choice
        options:
          - gemini
          - deepseek
          - anthropic
      locale:
        description: 'Target locale (de, sr, ar, es, ru, zh, fr, pt, pl)'
        required: true
        default: 'de'
      source:
        # VTID-03509. Every non-German locale is translated from `en` — the
        # script's default — so this is normally left alone. It exists for the
        # one case that default cannot express: translating INTO English, whose
        # source is the German original. With source==target the script's
        # "has this been translated?" test (target === source) is trivially
        # true for every key, so an `en` run would silently do nothing.
        #
        # EN is the pivot: es/sr/fr/pt/ru/pl all derive from it, so EN lagging
        # DE quietly caps every downstream locale at the staleness of English.
        description: 'Source locale to translate FROM (use de when locale=en)'
        required: false
        default: 'en'
      shard:
        description: 'Shard name (omit for all)'
        required: false
        default: ''
      batch:
        description: 'Strings per API call'
        required: false
        default: '30'

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Keyed by LOCALE as well as ref (VTID-03509). Keying on the ref alone
  # serializes every locale on a branch, and GitHub keeps only ONE pending run
  # per group: dispatching fr/pt/ru/pl back-to-back left fr running, pl pending,
  # and SILENTLY CANCELLED pt and ru. `cancel-in-progress: false` does not
  # prevent that — it only protects the run that is already executing.
  #
  # Two runs for different locales never touch the same files (each writes only
  # src/i18n/<locale>/), and the push step below already rebases with retries,
  # so letting them run concurrently is safe and turns a multi-locale expansion
  # from hours of queueing into one pass.
  group: i18n-translate-${{ github.ref }}-${{ inputs.locale }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # VTID-03569. Flag keys whose EN source has CHANGED since they were
      # translated, so the translator re-does them in the same run.
      #
      # --init only ever flags keys MISSING from the target. A key that exists
      # but whose English source was since rewritten is present, non-empty and
      # plausible-looking — invisible to --init, and permanently so: every
      # subsequent run also skips it. Drift is the failure mode a catalog at
      # "100% coverage" still has, because coverage counts rows and a stale row
      # is still a row.
      #
      # Not continue-on-error: --flag mutates the catalogs and must either do
      # that correctly or stop before the translator spends money on the result.
      - name: Flag drifted keys for re-translation
        run: node scripts/i18n-stamp-source.mjs --locale=${{ inputs.locale }} --flag

      # continue-on-error so a PARTIAL failure still reaches the commit step.
      # translate-keys.mjs exits 1 if ANY key failed, and the script persists
      # after every batch — so without this, a run that translated 14,068 of
      # 14,160 keys discarded all 14,068 because the commit step never ran.
      # That is exactly what happened on the first fr/pt/ru/pl dispatch.
      - name: Run translator
        id: translate
        continue-on-error: true
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # --init bootstraps a new locale dir from en/ if missing; idempotent
          # for existing locales (only flags untranslated leaves).
          ARGS="--init --provider=${{ inputs.provider }} --locale=${{ inputs.locale }} --batch=${{ inputs.batch }} --source=${{ inputs.source }}"
          if [ -n "${{ inputs.shard }}" ]; then
            ARGS="$ARGS --shard=${{ inputs.shard }}"
          fi
          echo "Running: node scripts/translate-keys.mjs $ARGS"
          node scripts/translate-keys.mjs $ARGS

      # VTID-03569. Re-stamp what the translator just wrote, in the SAME run
      # that wrote it.
      #
      # The drift gate demands a stamp per translated key, and nothing in this
      # workflow ever produced one — so every translate run left the gate red
      # ("N never stamped") and needed a separate manual command that is easy
      # to forget and invisible when forgotten. The loop is now self-closing:
      # translate and stamp are two halves of one operation and cannot drift
      # apart, because they cannot be run separately.
      #
      # always(), because a partial translation still needs its successful keys
      # stamped — otherwise re-running would treat them as untranslated and pay
      # for them a second time. Stamps are derived from the catalogs on disk, so
      # they describe exactly what is there, complete or not.
      - name: Re-stamp translated keys
        if: always()
        run: node scripts/i18n-stamp-source.mjs --locale=${{ inputs.locale }}

      # always() so partial progress is committed even when the translator
      # reported failures. The script is idempotent and resumable — keys that
      # succeeded are written and cleared of _pending_review, so a re-run picks
      # up only what is left instead of paying for the whole locale again.
      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git diff --quiet` doesn't see new untracked files (a fresh locale dir from --init).
          # Stage everything first, then check the cached diff against HEAD.
          #
          # i18n-source-stamps/ as well as src/i18n/ (VTID-03569) — the stamps
          # are written by the step above and live OUTSIDE src/i18n/. Staging
          # only the catalogs would commit the translations and silently discard
          # the record of what they were translated from, which is precisely the
          # state the drift gate reports as "never stamped".
          git add src/i18n/ i18n-source-stamps/
          if git diff --cached --quiet; then
            echo "No translation changes."
            exit 0
          fi
          git commit -m "chore(i18n): drain _pending_review via ${{ inputs.provider }} for ${{ inputs.locale }} (actor=${{ github.actor }})"
          # Concurrent runs (e.g. two locales translated in parallel) can race
          # the push; rebase against the latest ref before retrying.
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${{ github.ref_name }} || true
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed — backing off"
            sleep $((5 * i))
          done
          echo "push failed after 5 attempts"
          exit 1

      # Report the translator's own verdict last, so a partial run is visibly
      # red (there is still work to do) without having cost us the work that
      # did succeed. Re-dispatch the same locale to drain the remainder.
      - name: Fail if the translator reported unfinished keys
        if: always() && steps.translate.outcome == 'failure'
        run: |
          echo "The translator exited non-zero: some keys were not translated."
          echo "Whatever succeeded has been committed and pushed above."
          echo "Re-dispatch this workflow for the same locale to drain the rest."
          exit 1
