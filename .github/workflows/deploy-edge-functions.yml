name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Function to deploy (leave empty to deploy all changed functions)'
        required: false
        type: string

env:
  SUPABASE_PROJECT_REF: inmkhvwdcuyhnxkgfvsb

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Determine functions to deploy
        id: functions
        run: |
          if [ -n "${{ inputs.function_name }}" ]; then
            echo "list=${{ inputs.function_name }}" >> "$GITHUB_OUTPUT"
          else
            # Get changed function directories from the last commit
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- supabase/functions/ \
              | grep -oP 'supabase/functions/\K[^/]+' \
              | sort -u \
              | tr '\n' ' ')
            echo "list=${CHANGED}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy functions
        if: steps.functions.outputs.list != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in ${{ steps.functions.outputs.list }}; do
            echo "Deploying $fn..."
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done
