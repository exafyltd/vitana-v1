# AWS-STAGE-DEPLOY-FRONTEND — build the community app with the AWS staging
# gateway baked in, push to ECR, and roll the ECS service.
#
# This is the AWS twin of STAGE-DEPLOY-FRONTEND.yml (which deploys the GCP
# community-app-staging via Cloud Run). Same build mechanism: write
# .env.production BEFORE the image build so Vite bakes the STAGING gateway
# URL into the bundle — without it the bundle points at prod
# (gateway.vitanaland.com) and the AWS "staging" frontend silently talks to
# the GCP production stack (exactly the defect the AWS parity validation
# found; see vitana-platform docs/AWS-STAGING-VALIDATION.md and PR #2888).
#
# Required repository secrets:
#   AWS_STAGING_ACCESS_KEY_ID / AWS_STAGING_SECRET_ACCESS_KEY
#   (IAM user claude-staging-validation — needs ECR push + ECS update)
#
# Dispatch-only for now. Post-verify checks the LIVE hostname serves a
# bundle that bakes the requested gateway URL — the deploy fails loudly if
# the wiring didn't take.

name: AWS Stage Deploy Community App (ECS)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
      - '.github/workflows/AWS-STAGE-DEPLOY-FRONTEND.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for this AWS staging deploy'
        required: false
        default: 'manual deploy'
      gateway_url:
        description: 'Gateway base URL to bake into the bundle'
        required: false
        default: 'https://preview-aws-gateway.vitanaland.com'
      frontend_url:
        description: 'Public frontend URL used for post-deploy verification'
        required: false
        default: 'https://preview-aws.vitanaland.com'
      aws_region:
        description: 'AWS region'
        required: false
        default: 'eu-central-1'
      ecr_repository:
        description: 'ECR repository name for the frontend image'
        required: false
        default: 'vitana/community-app'
      ecs_cluster:
        description: 'ECS cluster name'
        required: false
        default: 'Vitana-ECS-Cluster'
      ecs_service:
        description: 'ECS service name'
        required: false
        default: 'vitana-community-app'

permissions:
  contents: read

concurrency:
  group: aws-stage-deploy-community-app
  cancel-in-progress: false

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    # On push events the dispatch inputs are empty — resolve every target
    # here with the staging defaults so auto-deploys and manual dispatches
    # share one code path. Paths above mirror STAGE-DEPLOY-FRONTEND.yml so
    # both stagings (GCP + AWS) always run identical code.
    env:
      GATEWAY_URL: ${{ inputs.gateway_url || 'https://preview-aws-gateway.vitanaland.com' }}
      FRONTEND_URL: ${{ inputs.frontend_url || 'https://preview-aws.vitanaland.com' }}
      TARGET_AWS_REGION: ${{ inputs.aws_region || 'eu-central-1' }}
      ECR_REPOSITORY: ${{ inputs.ecr_repository || 'vitana/community-app' }}
      ECS_CLUSTER: ${{ inputs.ecs_cluster || 'Vitana-ECS-Cluster' }}
      ECS_SERVICE: ${{ inputs.ecs_service || 'vitana-community-app' }}
      DEPLOY_REASON: ${{ inputs.reason || 'auto-deploy on push to main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Write .env.production with AWS staging gateway URL
        run: |
          # Vite (production mode) lets .env.production OVERRIDE .env.
          # Only the gateway is overridden; Supabase inherits the prod
          # project from .env — REQUIRED, because the staging gateway
          # authenticates against the prod Supabase project (see
          # BOOTSTRAP-ORB-STAGING-SUPABASE-ALIGN in vitana-platform).
          cat > .env.production <<EOF
          # Generated by AWS-STAGE-DEPLOY-FRONTEND.yml — do not commit.
          VITE_GATEWAY_BASE=${{ env.GATEWAY_URL }}
          VITE_GATEWAY_URL=${{ env.GATEWAY_URL }}/api/v1
          EOF
          sed 's/=.*/=<value>/' .env.production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_STAGING_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_STAGING_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.TARGET_AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Preflight — verify ECR repo + ECS service exist
        run: |
          set -e
          if ! aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY }}" >/dev/null 2>&1; then
            echo "::error::ECR repository '${{ env.ECR_REPOSITORY }}' not found. Available repositories:"
            aws ecr describe-repositories --query 'repositories[].repositoryName' --output table
            exit 1
          fi
          if ! aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}" \
               --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            echo "::error::ECS service '${{ env.ECS_SERVICE }}' not ACTIVE in cluster '${{ env.ECS_CLUSTER }}'. Services:"
            aws ecs list-services --cluster "${{ env.ECS_CLUSTER }}" --output table
            exit 1
          fi

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -e
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE="$REGISTRY/${{ env.ECR_REPOSITORY }}:$SHORT_SHA"
          docker build -t "$IMAGE" -t "$REGISTRY/${{ env.ECR_REPOSITORY }}:staging-latest" .
          docker push "$IMAGE"
          docker push "$REGISTRY/${{ env.ECR_REPOSITORY }}:staging-latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE"

      - name: Register task-definition revision + roll the service
        run: |
          set -e
          IMAGE="${{ steps.build.outputs.image }}"
          TD_ARN=$(aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' --output text)
          echo "Current task definition: $TD_ARN"
          NEW_DEF=$(aws ecs describe-task-definition --task-definition "$TD_ARN" --query taskDefinition \
            | jq --arg IMG "$IMAGE" '
                .containerDefinitions[0].image = $IMG
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                      .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)')
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $NEW_ARN"
          aws ecs update-service --cluster "${{ env.ECS_CLUSTER }}" --service "${{ env.ECS_SERVICE }}" \
            --task-definition "$NEW_ARN" >/dev/null
          echo "Waiting for service to stabilize (up to ~10 min)…"
          aws ecs wait services-stable --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}"
          echo "Service stable on $NEW_ARN"

      - name: Post-deploy verify — live bundle must bake the staging gateway
        run: |
          set -e
          FRONTEND="${{ env.FRONTEND_URL }}"
          GATEWAY_HOST=$(echo "${{ env.GATEWAY_URL }}" | sed -E 's|https?://||; s|/.*||')
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /tmp/index.html -w "%{http_code}" "$FRONTEND/" || echo 000)
            [ "$CODE" = "200" ] && break
            echo "Attempt $i: HTTP $CODE — retry in 10s"; sleep 10
          done
          [ "$CODE" = "200" ] || { echo "::error::$FRONTEND/ did not answer 200"; exit 1; }
          BUNDLE=$(grep -oE 'src="[^"]+\.js"' /tmp/index.html | head -1 | sed 's/src="//;s/"//')
          [ -n "$BUNDLE" ] || { echo "::error::no JS bundle reference found in index.html"; exit 1; }
          curl -s "$FRONTEND$BUNDLE" -o /tmp/bundle.js
          if grep -q "$GATEWAY_HOST" /tmp/bundle.js; then
            echo "✓ Live bundle bakes $GATEWAY_HOST"
          else
            echo "::error::Live bundle does NOT contain $GATEWAY_HOST — the frontend is still pointing elsewhere. Check ALB host rule / CDN cache / task rollout."
            exit 1
          fi
          if grep -q "gateway.vitanaland.com" /tmp/bundle.js; then
            echo "::warning::Bundle still references gateway.vitanaland.com (prod). Verify no code path calls it directly."
          fi
          {
            echo "## AWS staging frontend deploy"
            echo "- Image: \`${{ steps.build.outputs.image }}\`"
            echo "- Gateway baked in: \`${{ env.GATEWAY_URL }}\`"
            echo "- Verified live at: $FRONTEND"
            echo "- Reason: ${{ env.DEPLOY_REASON }}"
          } >> "$GITHUB_STEP_SUMMARY"
