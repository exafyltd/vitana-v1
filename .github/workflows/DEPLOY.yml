name: Deploy Community App to Cloud Run

# Deploys vitana-v1 (React/Vite SPA) to Cloud Run service 'community-app'
# Runs alongside Lovable CDN until migration is verified complete

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-community-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}
          project_id: lovable-vitana-vers1

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy community-app \
            --source=. \
            --region=us-central1 \
            --project=lovable-vitana-vers1 \
            --allow-unauthenticated \
            --quiet

          # Get deployed URL
          URL=$(gcloud run services describe community-app \
            --region=us-central1 \
            --project=lovable-vitana-vers1 \
            --format='value(status.url)')
          echo "DEPLOY_URL=$URL" >> $GITHUB_ENV
          echo "Deployed to: $URL"

      - name: Health Check
        run: |
          echo "Running health check on $DEPLOY_URL/healthz"
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL/healthz" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check attempt $i: HTTP $STATUS - retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check failed after 6 attempts"
          exit 1
