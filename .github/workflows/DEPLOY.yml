name: Deploy Community App to Cloud Run

# Deploys vitana-v1 (React/Vite SPA) to Cloud Run service 'community-app' (LIVE).
#
# STAGING-FIRST CUTOVER (effective Mon 8 Jun 2026, 10:00 Europe/Berlin):
# BEFORE the cutover, a push to `main` deploys to the LIVE community-app as
# before. AT/AFTER it, the automatic (push) path is FROZEN — frontend changes
# auto-deploy to STAGING via STAGE-DEPLOY-FRONTEND.yml (community-app-staging),
# and production is reached only via the Command Hub PUBLISH button or a manual
# `workflow_dispatch` of this workflow (the documented exception). The switch is
# time-based (see the `cutover_gate` job); manual dispatch is never frozen.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you deploying community-app to PROD manually (the documented exception)?'
        required: true
      commit_sha:
        description: 'Exact commit SHA to rebuild + deploy (the commit verified on community-app-staging). Empty → main HEAD. The frontend is REBUILT here (not image-promoted) because Vite bakes prod URLs from .env at build time — the staging image carries staging URLs and must never be promoted as-is.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  # Push deploys share one cancellable group so only the newest push builds.
  # Manual workflow_dispatch deploys to PROD each get a UNIQUE group and are
  # NEVER cancelled — otherwise an unrelated push to `main` (which post-cutover
  # only hits the frozen `cutover_gate` and no-ops) cancels an in-flight manual
  # prod deploy. That happened on 2026-06-23: a manual prod deploy was killed
  # mid-run by routine pushes landing seconds later.
  group: deploy-community-app-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Staging-first cutover gate. Freezes the AUTOMATIC (push) deploy of the live
  # community-app at/after the cutover instant. Manual dispatch is exempt.
  cutover_gate:
    runs-on: ubuntu-latest
    outputs:
      frozen: ${{ steps.gate.outputs.frozen }}
    steps:
      - name: Evaluate staging-first cutover
        id: gate
        shell: bash
        run: |
          CUTOVER_EPOCH="$(date -d 'TZ="Europe/Berlin" 2026-06-08 10:00:00' +%s)"
          NOW_EPOCH="$(date -u +%s)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual dispatch (reason: ${{ github.event.inputs.reason }}) → not frozen (deliberate prod exception)."
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          elif [ "$NOW_EPOCH" -ge "$CUTOVER_EPOCH" ]; then
            echo "::warning::Staging-first cutover ACTIVE — auto deploy of community-app to LIVE is frozen. Frontend auto-deploys to community-app-staging; promote via the Command Hub PUBLISH button or a manual dispatch."
            echo "frozen=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pre-cutover — auto deploy to live proceeds normally (cutover at $(date -u -d @${CUTOVER_EPOCH}) UTC)."
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: cutover_gate
    if: needs.cutover_gate.outputs.frozen != 'true'
    runs-on: ubuntu-latest
    steps:
      # Check out the exact tested staging commit when provided (the PUBLISH flow
      # passes it); otherwise main HEAD. Rebuilds with the committed prod .env.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha != '' && github.event.inputs.commit_sha || github.sha }}

      - name: Resolve deploy SHA
        id: deploy_sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}
          project_id: lovable-vitana-vers1

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy community-app \
            --source=. \
            --region=us-central1 \
            --project=lovable-vitana-vers1 \
            --allow-unauthenticated \
            --update-env-vars=GIT_COMMIT_SHA=${{ steps.deploy_sha.outputs.sha }},COMMIT_SHA=${{ steps.deploy_sha.outputs.sha }} \
            --quiet

          # Get deployed URL
          URL=$(gcloud run services describe community-app \
            --region=us-central1 \
            --project=lovable-vitana-vers1 \
            --format='value(status.url)')
          echo "DEPLOY_URL=$URL" >> $GITHUB_ENV
          echo "Deployed to: $URL"

      - name: Health Check
        run: |
          echo "Running health check on $DEPLOY_URL"
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL/" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check attempt $i: HTTP $STATUS - retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check failed after 6 attempts"
          exit 1

      - name: Trigger E2E smoke tests
        if: success()
        continue-on-error: true
        run: |
          echo "Dispatching E2E smoke tests against $DEPLOY_URL"
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CROSS_REPO_PAT }}" \
            https://api.github.com/repos/exafyltd/vitana-platform/dispatches \
            -d '{"event_type":"community-app-deployed","client_payload":{"community_url":"'"$DEPLOY_URL"'","projects":"desktop-community,mobile-community"}}'
          echo "E2E smoke test dispatch sent"
