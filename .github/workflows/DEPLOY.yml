name: Deploy Community App to Production (AWS)

# Deploys vitana-v1 (React/Vite SPA) to PRODUCTION.
#
# WHERE PRODUCTION ACTUALLY IS (VTID-03483): vitanaland.com and www are
# served by the AWS ECS service 'vitana-community-app-awsdr' (the aws_prod
# job). It is the ONLY job that deploys anything. If you change this
# workflow, keep the aws_prod job — without it this workflow does nothing
# any user can see.
#
# VTID-04833: the GCP Cloud Run `deploy` job is gone. It deployed to project
# lovable-vitana-vers1, whose billing was disabled 2026-08-16 (VTID-03649),
# so it failed on every run and turned every successful AWS production deploy
# red — 2026-09-29..10-01 every manual dispatch read "failure" while
# aws_prod / build-push-deploy had shipped. It was no longer a rollback
# target either (nothing on that project can serve traffic). Its
# `community-app-deployed` dispatch never fired (the deploy step failed
# first), and no automated suite may target production anyway (platform
# CLAUDE.md rule 48), so removing it changes nothing that ran.
#
# STAGING-FIRST CUTOVER (effective Mon 8 Jun 2026, 10:00 Europe/Berlin):
# BEFORE the cutover, a push to `main` deploys to the LIVE community-app as
# before. AT/AFTER it, the automatic (push) path is FROZEN — frontend changes
# auto-deploy to STAGING via STAGE-DEPLOY-FRONTEND.yml (community-app-staging),
# and production is reached only via the Command Hub PUBLISH button or a manual
# `workflow_dispatch` of this workflow (the documented exception). The switch is
# time-based (see the `cutover_gate` job); manual dispatch is never frozen.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you deploying community-app to PROD manually (the documented exception)?'
        required: true
      commit_sha:
        description: 'Exact commit SHA to rebuild + deploy (the commit verified on community-app-staging). Empty → main HEAD. The frontend is REBUILT here (not image-promoted) because Vite bakes prod URLs from .env at build time — the staging image carries staging URLs and must never be promoted as-is.'
        required: false
        default: ''

permissions:
  contents: read
  # VTID-04833: id-token was only for the removed GCP Workload Identity login;
  # aws_prod authenticates with access keys and asks for contents:read only.

concurrency:
  # Push deploys share one cancellable group so only the newest push builds.
  # Manual workflow_dispatch deploys to PROD each get a UNIQUE group and are
  # NEVER cancelled — otherwise an unrelated push to `main` (which post-cutover
  # only hits the frozen `cutover_gate` and no-ops) cancels an in-flight manual
  # prod deploy. That happened on 2026-06-23: a manual prod deploy was killed
  # mid-run by routine pushes landing seconds later.
  group: deploy-community-app-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Staging-first cutover gate. Freezes the AUTOMATIC (push) deploy of the live
  # community-app at/after the cutover instant. Manual dispatch is exempt.
  cutover_gate:
    runs-on: ubuntu-latest
    outputs:
      frozen: ${{ steps.gate.outputs.frozen }}
    steps:
      - name: Evaluate staging-first cutover
        id: gate
        shell: bash
        # DISPATCH_REASON is passed via env (NOT interpolated inline into the
        # script). The reason is free text from the PUBLISH button / a human; a
        # shell-special character (quote, backtick, $(), …) spliced straight into
        # `run:` would break this gate step and, because `aws_prod` needs it,
        # silently skip the whole prod promotion. Reading it as an env var is injection-safe.
        env:
          DISPATCH_REASON: ${{ github.event.inputs.reason }}
        run: |
          CUTOVER_EPOCH="$(date -d 'TZ="Europe/Berlin" 2026-06-08 10:00:00' +%s)"
          NOW_EPOCH="$(date -u +%s)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual dispatch (reason: ${DISPATCH_REASON}) → not frozen (deliberate prod exception)."
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          elif [ "$NOW_EPOCH" -ge "$CUTOVER_EPOCH" ]; then
            echo "::warning::Staging-first cutover ACTIVE — auto deploy of community-app to LIVE is frozen. Frontend auto-deploys to community-app-staging; promote via the Command Hub PUBLISH button or a manual dispatch."
            echo "frozen=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pre-cutover — auto deploy to live proceeds normally (cutover at $(date -u -d @${CUTOVER_EPOCH}) UTC)."
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi

  # THE JOB THAT ACTUALLY REACHES USERS (VTID-03483).
  #
  # vitanaland.com and www are served by the AWS ECS service
  # vitana-community-app-awsdr, not by Cloud Run — that moved at the
  # VTID-03419 cutover. Before this job existed, running this workflow
  # deployed Cloud Run, reported success everywhere, and left every visitor
  # on the previous build; shipping anything took a second, separate,
  # undocumented dispatch of AWS-PROD-DEPLOY-FRONTEND.yml. That gap burned a
  # whole afternoon of "deployed" fixes that were not live.
  #
  aws_prod:
    needs: cutover_gate
    if: needs.cutover_gate.outputs.frozen != 'true'
    uses: ./.github/workflows/AWS-PROD-DEPLOY-FRONTEND.yml
    secrets: inherit
    with:
      reason: >-
        Via DEPLOY.yml (${{ github.event_name }}):
        ${{ github.event.inputs.reason || 'automatic deploy' }}
      commit_sha: ${{ github.event.inputs.commit_sha || '' }}
