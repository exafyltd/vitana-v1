name: Apply VTID-05206 community_intro_opt_in migration

# Applies supabase/migrations/20261016110000_vtid_05206_community_intro_opt_in.sql
# to the live Supabase project via the Management API query endpoint using the
# existing SUPABASE_ACCESS_TOKEN secret. Idempotent (ADD COLUMN IF NOT EXISTS,
# SET DEFAULT), safe to re-run. Schema only: writes no rows. Every member who
# exists when it runs gets false; members who register afterwards get true.
#
# New-member welcome (lane new-member-card-optin): the News Feed shows a "new
# member" card only for members with global_community_profiles.
# community_intro_opt_in = true. Until this is applied the feed shows no
# new-member card (the query fails closed) and the Settings switch stays hidden.
#
# Triggers:
#   - Manual only: Actions tab -> "Run workflow".

on:
  # VTID-04949 (plan D2): no push trigger. Merging must never apply SQL to the
  # production database; migrations ship at Gate 2, dispatched in order.
  workflow_dispatch:
concurrency:
  group: apply-vtid-05206-community-intro-opt-in-migration
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: inmkhvwdcuyhnxkgfvsb
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1
          fi
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open('supabase/migrations/20261016110000_vtid_05206_community_intro_opt_in.sql').read()
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          try:
              r = urllib.request.urlopen(req)
              print('Apply OK, status', r.status)
              print((r.read().decode() or '[]')[:1000])
          except urllib.error.HTTPError as e:
              print('Apply FAILED, HTTP', e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Verify the column (NOT NULL, default true) and report who is introduced
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']

          def one(sql):
              req = urllib.request.Request(
                  f'https://api.supabase.com/v1/projects/{ref}/database/query',
                  data=json.dumps({'query': sql}).encode(),
                  headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                           'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
                  method='POST',
              )
              rows = json.loads(urllib.request.urlopen(req).read().decode() or '[]')
              return (rows[0] if rows else {}).get('n', 0)

          got = one("select count(*)::int as n from information_schema.columns where table_schema='public' "
                    "and table_name='global_community_profiles' and column_name='community_intro_opt_in' "
                    "and is_nullable='NO' and column_default='true'")
          print(f'column NOT NULL DEFAULT true: {got} (want 1)')
          # Informational: right after the first apply this is 0 (existing members are false).
          print('members introduced:', one("select count(*)::int as n from public.global_community_profiles where community_intro_opt_in"))
          if got != 1:
              raise SystemExit('::error::Verify failed: column NOT NULL DEFAULT true')
          print('Verify OK')
          PY
