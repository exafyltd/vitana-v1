name: Apply VTID-05475 community intro explicit-choice migration

# Applies supabase/migrations/20261103120000_vtid_05475_community_intro_explicit_choice.sql
# to the live Supabase project via the Management API query endpoint using the
# existing SUPABASE_ACCESS_TOKEN secret.
#
# ⚠️ APPLYING THIS MIGRATION IS AN OWNER STOP (collaboration.md §7d). Staging
# shares the production database, so this runs only after the owner approves the
# migration file AND the target database. The migration file merges with the
# lane; the app is backward-compatible until this is applied (src/lib/
# community-intro.ts retries writing only community_intro_opt_in on PGRST204 /
# 42703), so the Settings toggle and registration keep working before and after.
#
# What it does (one transaction, idempotent, re-runnable): adds
# community_intro_choice_at timestamptz NULL, sets community_intro_opt_in
# DEFAULT false, and backfills rows WITHOUT a recorded choice (choice_at IS NULL)
# from true to false. Recorded explicit choices (yes and no) are preserved. See
# the R2-F1 disclosure in docs/validation/VTID-05475/owner-decision.md: any
# explicit opt-in made during the pre-migration window has no marker and is
# reverted by the backfill. Schema + bounded backfill only; writes no new rows.
#
# Triggers:
#   - Manual only: Actions tab -> "Run workflow".

on:
  # No push trigger. Merging must never apply SQL to the production database;
  # applying is dispatched by the owner at Gate 2 (collaboration.md §7d).
  workflow_dispatch:
concurrency:
  group: apply-vtid-05475-community-intro-explicit-choice-migration
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: inmkhvwdcuyhnxkgfvsb
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1
          fi
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open('supabase/migrations/20261103120000_vtid_05475_community_intro_explicit_choice.sql').read()
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          try:
              r = urllib.request.urlopen(req)
              print('Apply OK, status', r.status)
              print((r.read().decode() or '[]')[:1000])
          except urllib.error.HTTPError as e:
              print('Apply FAILED, HTTP', e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Verify the columns (default false, marker exists) and report counts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']

          def one(sql):
              req = urllib.request.Request(
                  f'https://api.supabase.com/v1/projects/{ref}/database/query',
                  data=json.dumps({'query': sql}).encode(),
                  headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                           'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
                  method='POST',
              )
              rows = json.loads(urllib.request.urlopen(req).read().decode() or '[]')
              return (rows[0] if rows else {}).get('n', 0)

          # community_intro_opt_in is now boolean NOT NULL DEFAULT false (was true under VTID-05206).
          optin = one("select count(*)::int as n from information_schema.columns where table_schema='public' "
                      "and table_name='global_community_profiles' and column_name='community_intro_opt_in' "
                      "and is_nullable='NO' and column_default='false'")
          print(f'community_intro_opt_in NOT NULL DEFAULT false: {optin} (want 1)')

          # community_intro_choice_at exists as a nullable timestamptz marker.
          marker = one("select count(*)::int as n from information_schema.columns where table_schema='public' "
                       "and table_name='global_community_profiles' and column_name='community_intro_choice_at' "
                       "and data_type='timestamp with time zone' and is_nullable='YES'")
          print(f'community_intro_choice_at timestamptz NULL: {marker} (want 1)')

          # Informational, read-only: who is introduced and how many have a recorded choice.
          print('members introduced (opt_in true):', one("select count(*)::int as n from public.global_community_profiles where community_intro_opt_in"))
          print('members with a recorded choice (marker set):', one("select count(*)::int as n from public.global_community_profiles where community_intro_choice_at is not null"))
          # Invariant from the migration's own self-check: no unmarked row stays introduced.
          leftover = one("select count(*)::int as n from public.global_community_profiles where community_intro_choice_at is null and community_intro_opt_in")
          print(f'unmarked rows still introduced: {leftover} (want 0)')

          if optin != 1 or marker != 1 or leftover != 0:
              raise SystemExit('::error::Verify failed: expected opt_in DEFAULT false, marker column present, and no unmarked introduced rows')
          print('Verify OK')
          PY
