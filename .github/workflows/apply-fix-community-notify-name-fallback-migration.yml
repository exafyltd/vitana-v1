name: Apply community notify name-fallback fix migration

# Applies supabase/migrations/20260812090000_fix_community_notify_name_fallback.sql
# to the live Supabase project via the Management API query endpoint using the
# existing SUPABASE_ACCESS_TOKEN secret. Idempotent (CREATE OR REPLACE only),
# safe to re-run. Fixes community post/video/like/comment/follow/mention
# notifications falling back to "Jemand"/"Someone" for users with no
# profiles.display_name by adding a "@<vitana_id>" fallback before the
# generic placeholder.
#
# Triggers:
#   - Auto:   push to main that touches the migration file or this workflow.
#   - Manual: Actions tab -> "Run workflow".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260812090000_fix_community_notify_name_fallback.sql'
      - '.github/workflows/apply-fix-community-notify-name-fallback-migration.yml'

concurrency:
  group: apply-fix-community-notify-name-fallback-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: inmkhvwdcuyhnxkgfvsb
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1
          fi
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open('supabase/migrations/20260812090000_fix_community_notify_name_fallback.sql').read()
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          try:
              r = urllib.request.urlopen(req)
              print('Apply OK, status', r.status)
              print((r.read().decode() or '[]')[:1000])
          except urllib.error.HTTPError as e:
              print('Apply FAILED, HTTP', e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Verify all 8 functions exist and carry the vitana_id fallback
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']

          def query(sql):
              req = urllib.request.Request(
                  f'https://api.supabase.com/v1/projects/{ref}/database/query',
                  data=json.dumps({'query': sql}).encode(),
                  headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                           'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
                  method='POST',
              )
              return json.loads(urllib.request.urlopen(req).read().decode() or '[]')

          names = (
              "'notify_community_on_public_post','notify_community_on_public_video',"
              "'notify_on_profile_post_like','notify_on_profile_post_comment',"
              "'notify_on_media_upload_like','notify_on_media_upload_comment',"
              "'notify_on_new_follower','_dispatch_post_mention_notifications'"
          )

          fns = query(f"select count(*)::int as n from pg_proc where proname in ({names});")
          nf = (fns[0] if fns else {}).get('n', 0)
          print('Functions found:', nf)
          if nf != 8:
              raise SystemExit(f"::error::Expected 8 functions, found {nf}")

          fallback = query(
              f"select count(*)::int as n from pg_proc where proname in ({names}) "
              "and prosrc like '%vitana_id%';"
          )
          nb = (fallback[0] if fallback else {}).get('n', 0)
          print('Functions with vitana_id fallback:', nb)
          if nb != 8:
              raise SystemExit(f"::error::Expected all 8 functions to reference vitana_id, found {nb}")

          print('Verify OK: 8 functions present, all carry the vitana_id fallback.')
          PY
