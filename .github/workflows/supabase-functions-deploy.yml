name: Deploy Supabase Edge Functions

# Deploys functions under supabase/functions/ to the live Supabase project.
#
# Triggers:
#   - Auto:   any push to main that changes files under supabase/functions/
#             → deploys only the functions whose folders changed.
#   - Manual: Actions tab → "Run workflow" → optionally list specific
#             function names (space-separated) to deploy.
#
# Required repository secret:
#   SUPABASE_ACCESS_TOKEN — personal access token from
#     https://supabase.com/dashboard/account/tokens

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-functions-deploy.yml'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Space-separated function names to deploy (leave empty to deploy whatever changed in the last commit)'
        required: false
        default: ''

concurrency:
  group: supabase-functions-deploy
  cancel-in-progress: false

jobs:
  # Staging-first cutover gate. Freezes the AUTOMATIC (push) deploy of edge
  # functions to the LIVE Supabase project at/after Mon 8 Jun 2026, 10:00
  # Europe/Berlin. No staging-functions auto-deploy exists yet, so the push path
  # is freeze-only post-cutover; deploy via manual workflow_dispatch (the
  # documented exception). Manual dispatch is never frozen.
  cutover_gate:
    runs-on: ubuntu-latest
    outputs:
      frozen: ${{ steps.gate.outputs.frozen }}
    steps:
      - name: Evaluate staging-first cutover
        id: gate
        shell: bash
        run: |
          CUTOVER_EPOCH="$(date -d 'TZ="Europe/Berlin" 2026-06-08 10:00:00' +%s)"
          NOW_EPOCH="$(date -u +%s)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual dispatch → not frozen (deliberate prod exception)."
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          elif [ "$NOW_EPOCH" -ge "$CUTOVER_EPOCH" ]; then
            echo "::warning::Staging-first cutover ACTIVE — auto deploy of edge functions to the LIVE Supabase project is frozen. Use a manual workflow_dispatch to ship."
            echo "frozen=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pre-cutover — auto deploy proceeds (cutover at $(date -u -d @${CUTOVER_EPOCH}) UTC)."
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: cutover_gate
    if: needs.cutover_gate.outputs.frozen != 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: inmkhvwdcuyhnxkgfvsb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: supabase/setup-cli@v1
        with:
          version: 1.226.4

      - name: Determine functions to deploy
        id: list
        run: |
          set -euo pipefail
          INPUT_FNS="${{ github.event.inputs.functions }}"
          if [[ -n "$INPUT_FNS" ]]; then
            FUNCS="$INPUT_FNS"
            echo "Manual dispatch — using inputs.functions"
          else
            FUNCS=$(git diff --name-only HEAD^ HEAD -- 'supabase/functions/' \
              | awk -F/ '$2 == "functions" && $3 != "" {print $3}' \
              | sort -u \
              | grep -v '^_' \
              | tr '\n' ' ')
            echo "Push event — detected changed functions from git diff"
          fi
          echo "Functions to deploy: '$FUNCS'"
          echo "functions=$FUNCS" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.list.outputs.functions != ''
        run: |
          set -euo pipefail
          for fn in ${{ steps.list.outputs.functions }}; do
            echo "::group::Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done

      - name: Nothing to deploy
        if: steps.list.outputs.functions == ''
        run: echo "No functions changed in this push and no manual input provided — skipping deploy."
