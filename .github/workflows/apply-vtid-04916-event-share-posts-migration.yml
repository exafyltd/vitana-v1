name: Apply VTID-04916 event share posts migration

# Applies supabase/migrations/20261007100000_vtid_04916_profile_posts_event_attachment.sql
# to the live Supabase project via the Management API query endpoint using the
# existing SUPABASE_ACCESS_TOKEN secret. Idempotent (ADD COLUMN IF NOT EXISTS,
# guarded constraints, IF NOT EXISTS indexes, CREATE OR REPLACE), safe to
# re-run. Schema only: writes no rows.
#
# Adds profile_posts.attached_ref_type / attached_ref_id (the event a post
# shares, set only by the gateway's share-to-feed route) and teaches
# trg_notify_community_post to send a deduplicated 'community_event_shared'
# notification for such posts. Posts without a reference notify exactly as
# before. Tested by SQL-EVENT-SHARE-POSTS.yml.
#
# Triggers:
#   - Auto:   push to main that touches the migration file or this workflow.
#   - Manual: Actions tab -> "Run workflow".

on:
  # VTID-04949 (plan D2): no push trigger. Merging must never apply SQL to the
  # production database; migrations ship at Gate 2, dispatched in order.
  workflow_dispatch:
concurrency:
  group: apply-vtid-04916-event-share-posts-migration
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: inmkhvwdcuyhnxkgfvsb
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1
          fi
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open('supabase/migrations/20261007100000_vtid_04916_profile_posts_event_attachment.sql').read()
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          try:
              r = urllib.request.urlopen(req)
              print('Apply OK, status', r.status)
              print((r.read().decode() or '[]')[:1000])
          except urllib.error.HTTPError as e:
              print('Apply FAILED, HTTP', e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Verify columns, guard trigger and share notification branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']

          def one(sql):
              req = urllib.request.Request(
                  f'https://api.supabase.com/v1/projects/{ref}/database/query',
                  data=json.dumps({'query': sql}).encode(),
                  headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                           'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
                  method='POST',
              )
              rows = json.loads(urllib.request.urlopen(req).read().decode() or '[]')
              return (rows[0] if rows else {}).get('n', 0)

          checks = {
              'columns': ("select count(*)::int as n from information_schema.columns where table_schema='public' "
                          "and table_name='profile_posts' and column_name in ('attached_ref_type','attached_ref_id')", 2),
              'unique index': ("select count(*)::int as n from pg_indexes where indexname='idx_profile_posts_one_share_per_event'", 1),
              'guard trigger': ("select count(*)::int as n from pg_trigger where tgname='trg_profile_posts_guard_attached_ref'", 1),
              'notify branch': ("select count(*)::int as n from pg_proc where proname='notify_community_on_public_post' "
                                "and prosrc like '%community_event_shared%' and prosrc like '%shared a new post%'", 1),
          }
          bad = []
          for name, (sql, want) in checks.items():
              got = one(sql)
              print(f'{name}: {got} (want {want})')
              if got != want:
                  bad.append(name)
          if bad:
              raise SystemExit('::error::Verify failed: ' + ', '.join(bad))
          print('Verify OK')
          PY
