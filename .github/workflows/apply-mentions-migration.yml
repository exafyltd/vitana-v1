name: Apply @mentions migration (VTID-04926)

# Adds search_mention_candidates() (the @mention picker's member search),
# mentions columns + comment_mention triggers on the two comment tables, and the
# recipient guard on post/comment mention notifications
# (supabase/migrations/20261006140000_vtid_04926_mentions.sql) to the live
# Supabase project using the Management API query endpoint and the existing
# SUPABASE_ACCESS_TOKEN secret — no DB password required. The SQL is idempotent
# (ADD COLUMN IF NOT EXISTS / CREATE OR REPLACE / DROP TRIGGER IF EXISTS), so the
# job is safe to re-run. Schema only — it writes no rows.
#
# Triggers:
#   - Auto:   push to main that touches the migration file or this workflow.
#   - Manual: Actions tab -> "Run workflow".

on:
  # VTID-04949 (plan D2): no push trigger. Merging must never apply SQL to the
  # production database; migrations ship at Gate 2, dispatched in order.
  workflow_dispatch:
concurrency:
  group: apply-mentions-migration
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: inmkhvwdcuyhnxkgfvsb
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1
          fi
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open('supabase/migrations/20261006140000_vtid_04926_mentions.sql').read()
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              r = urllib.request.urlopen(req)
              print('Apply OK, status', r.status)
              print((r.read().decode() or '[]')[:1000])
          except urllib.error.HTTPError as e:
              print('Apply FAILED, HTTP', e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Verify columns, RPC and triggers exist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = ("select "
                 "exists(select 1 from information_schema.columns where table_schema='public' and table_name='profile_post_comments' and column_name='mentions') "
                 "and exists(select 1 from information_schema.columns where table_schema='public' and table_name='media_upload_comments' and column_name='mentions') as table_exists, "
                 "exists(select 1 from pg_proc where proname='search_mention_candidates') "
                 "and exists(select 1 from pg_trigger where tgname='trg_notify_profile_post_comment_mention') "
                 "and exists(select 1 from pg_trigger where tgname='trg_notify_media_upload_comment_mention') as rpc_exists;")
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json'},
              method='POST',
          )
          r = urllib.request.urlopen(req)
          body = r.read().decode()
          print('Verify:', body)
          # Assert the apply actually took effect — otherwise a silent no-op
          # would leave the job green while tagging in comments keeps failing.
          rows = json.loads(body or '[]')
          row = rows[0] if rows else {}
          if not (row.get('table_exists') and row.get('rpc_exists')):
              raise SystemExit(
                  f"::error::Migration did not take effect "
                  f"(table_exists={row.get('table_exists')}, rpc_exists={row.get('rpc_exists')})"
              )
          print('Verify OK: columns, RPC and triggers present.')
          PY
