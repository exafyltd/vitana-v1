# Phase 0 staging preview (handoff brief P0.2, Lovable-style preview URLs):
#
# Deploys community-app-staging Cloud Run service on every push to main and
# on manual dispatch. Mirrors DEPLOY.yml's pattern but writes a build-time
# .env.production override so Vite bakes the STAGING gateway/Supabase URLs
# into the bundle. Without the override, the bundle would point at prod
# (gateway.vitanaland.com + the prod Supabase) and the "preview" URL would
# silently serve prod content — defeating the isolation.
#
# Target URL after Cloudflare CNAME is wired:
#   https://preview.vitanaland.com  →  this service
#
# Source-of-truth env values are hardcoded in this workflow — none are
# secret (anon JWT key is what every browser session gets). The staging
# Supabase URL + anon key were captured during Phase 0 build (see
# vitana-platform docs/STAGING.md §9b).

name: Stage Deploy Community App (community-app-staging)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
      - '.github/workflows/STAGE-DEPLOY-FRONTEND.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual staging redeploy'
        required: false
        default: 'manual smoke'

permissions:
  contents: read
  id-token: write

concurrency:
  group: stage-deploy-community-app
  cancel-in-progress: true

env:
  GCP_PROJECT: lovable-vitana-vers1
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: community-app-staging
  STAGING_GATEWAY_URL: https://preview-gateway.vitanaland.com
  STAGING_SUPABASE_URL: https://rsdakjqpvcpgomltdmxu.supabase.co
  STAGING_SUPABASE_PROJECT_ID: rsdakjqpvcpgomltdmxu
  STAGING_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzZGFranFwdmNwZ29tbHRkbXh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzODcwNzAsImV4cCI6MjA5NDk2MzA3MH0.tRQnKumYuCwVcOuxRCAbwPnuGsuNueKTC40OLw2sN6w

jobs:
  stage-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}
          project_id: lovable-vitana-vers1

      - uses: google-github-actions/setup-gcloud@v2

      - name: Write .env.production with staging URLs
        run: |
          # Vite picks up .env.production in production mode (npm run build).
          # Values here OVERRIDE anything in .env. We only override the
          # staging-isolation-critical vars (gateway + Supabase). Other VITE_*
          # vars (oasis-operator, etc.) inherit prod values from .env — see
          # docs/STAGING.md §6 for the rationale.
          cat > .env.production <<EOF
          # Generated by STAGE-DEPLOY-FRONTEND.yml — do not commit.
          VITE_GATEWAY_BASE=${STAGING_GATEWAY_URL}
          VITE_GATEWAY_URL=${STAGING_GATEWAY_URL}/api/v1
          VITE_SUPABASE_URL=${STAGING_SUPABASE_URL}
          VITE_SUPABASE_PROJECT_ID=${STAGING_SUPABASE_PROJECT_ID}
          VITE_SUPABASE_PUBLISHABLE_KEY=${STAGING_SUPABASE_ANON_KEY}
          SUPABASE_URL=${STAGING_SUPABASE_URL}
          SUPABASE_PUBLISHABLE_KEY=${STAGING_SUPABASE_ANON_KEY}
          EOF
          echo "wrote .env.production:"
          sed 's/=.*/=<value>/' .env.production

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --source=. \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT}" \
            --allow-unauthenticated \
            --quiet

          URL=$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.url)')
          REV=$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
            --format='value(status.latestReadyRevisionName)')
          echo "deploy_url=$URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "Deployed: ${CLOUD_RUN_SERVICE}@${REV} → $URL"

      - name: Health check
        env:
          URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retry in 10s"
            sleep 10
          done
          echo "::error::Health check failed after 6 attempts"
          exit 1
