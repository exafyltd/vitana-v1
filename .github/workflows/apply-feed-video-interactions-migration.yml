name: Apply feed video interactions migration

# Applies the News-feed inline like/comment migration for community videos
# (supabase/migrations/20260622000000_feed_video_interactions.sql) to the live
# Supabase project using the Management API query endpoint and the existing
# SUPABASE_ACCESS_TOKEN secret — no DB password required. The SQL is idempotent
# (ADD COLUMN IF NOT EXISTS / CREATE TABLE IF NOT EXISTS / CREATE OR REPLACE /
# DROP POLICY|TRIGGER IF EXISTS), so the job is safe to re-run.
#
# Triggers:
#   - Auto:   push to main that touches the migration file or this workflow.
#   - Manual: Actions tab -> "Run workflow".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260622000000_feed_video_interactions.sql'
      - '.github/workflows/apply-feed-video-interactions-migration.yml'

concurrency:
  group: apply-feed-video-interactions-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: inmkhvwdcuyhnxkgfvsb
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1
          fi
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open('supabase/migrations/20260622000000_feed_video_interactions.sql').read()
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          try:
              r = urllib.request.urlopen(req)
              print('Apply OK, status', r.status)
              print((r.read().decode() or '[]')[:1000])
          except urllib.error.HTTPError as e:
              print('Apply FAILED, HTTP', e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Verify tables + column exist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = ("select to_regclass('public.media_upload_likes') is not null as likes_table, "
                 "to_regclass('public.media_upload_comments') is not null as comments_table, "
                 "exists(select 1 from information_schema.columns where table_schema='public' "
                 "and table_name='media_uploads' and column_name='comments_count') as comments_count_col;")
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          r = urllib.request.urlopen(req)
          body = r.read().decode()
          print('Verify:', body)
          rows = json.loads(body or '[]')
          row = rows[0] if rows else {}
          if not (row.get('likes_table') and row.get('comments_table') and row.get('comments_count_col')):
              raise SystemExit(
                  f"::error::Migration did not take effect "
                  f"(likes_table={row.get('likes_table')}, "
                  f"comments_table={row.get('comments_table')}, "
                  f"comments_count_col={row.get('comments_count_col')})"
              )
          print('Verify OK: tables + column present.')
          PY
