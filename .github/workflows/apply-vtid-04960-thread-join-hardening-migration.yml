name: Apply VTID-04960 thread participants join hardening migration

# Applies supabase/migrations/20261007180000_vtid_04960_thread_participants_join_hardening.sql
# to the live Supabase project via the Management API query endpoint using the
# existing SUPABASE_ACCESS_TOKEN secret. Idempotent (CREATE OR REPLACE, DROP ...
# IF EXISTS + CREATE), safe to re-run. Schema only: writes no rows.
#
# Members can no longer add themselves to conversations they were not invited
# to, nor move their participant row or promote themselves. Tested by
# SQL-THREAD-JOIN-HARDENING.yml. The verify step fails if the old self-join
# policy survives or any participant UPDATE policy lacks a WITH CHECK.
#
# Triggers:
#   - Auto:   push to main that touches the migration file or this workflow.
#   - Manual: Actions tab -> "Run workflow".

on:
  # VTID-04949 (plan D2): no push trigger. Merging must never apply SQL to the
  # production database; migrations ship at Gate 2, dispatched in order.
  workflow_dispatch:
concurrency:
  group: apply-vtid-04960-thread-join-hardening-migration
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: inmkhvwdcuyhnxkgfvsb
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1
          fi
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open('supabase/migrations/20261007180000_vtid_04960_thread_participants_join_hardening.sql').read()
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          try:
              r = urllib.request.urlopen(req)
              print('Apply OK, status', r.status)
              print((r.read().decode() or '[]')[:1000])
          except urllib.error.HTTPError as e:
              print('Apply FAILED, HTTP', e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Verify policies and triggers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']

          def one(sql):
              req = urllib.request.Request(
                  f'https://api.supabase.com/v1/projects/{ref}/database/query',
                  data=json.dumps({'query': sql}).encode(),
                  headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                           'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
                  method='POST',
              )
              rows = json.loads(urllib.request.urlopen(req).read().decode() or '[]')
              return (rows[0] if rows else {}).get('n', 0)

          T = "tablename in ('global_thread_participants','thread_participants') and schemaname='public'"
          checks = {
              'old self-join policy gone': (f"select count(*)::int as n from pg_policies where {T} and policyname='Users can join threads as themselves'", 0),
              'new creator-join policy on both tables': (f"select count(*)::int as n from pg_policies where {T} and policyname='Thread creators can join their own threads' and cmd='INSERT'", 2),
              'no UPDATE policy without WITH CHECK': (f"select count(*)::int as n from pg_policies where {T} and cmd='UPDATE' and with_check is null", 0),
              'own-row UPDATE policy on both tables': (f"select count(*)::int as n from pg_policies where {T} and policyname='Members can update their own participation'", 2),
              'guard triggers': ("select count(*)::int as n from pg_trigger where tgname in ('trg_guard_global_thread_participant_update','trg_guard_thread_participant_update') and not tgisinternal", 2),
          }
          bad = []
          for name, (sql, want) in checks.items():
              got = one(sql)
              print(f'{name}: {got} (want {want})')
              if got != want:
                  bad.append(name)
          if bad:
              raise SystemExit('::error::Verify failed: ' + ', '.join(bad))
          print('Verify OK')
          PY
