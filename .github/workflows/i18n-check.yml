name: i18n check

# Wave 6: BLOCKING. ESLint i18n rules (no-raw-jsx-text + no-raw-toast-arg)
# fail PRs that introduce hardcoded user-visible strings. Inventory drift
# also fails the PR — run `npm run i18n:inventory` and commit the result.
# Catalog audit still runs in --report-only mode for the 9 pre-existing
# DE→EN drifts; flip to --strict once those are backfilled.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/i18n-*'
      - 'scripts/generate-screen-inventory.mjs'
      - 'scripts/split-i18n.mjs'
      - 'eslint-rules/**'
      - 'eslint.config.js'
      - 'docs/SCREEN_INVENTORY.md'
      - '.github/workflows/i18n-check.yml'
  push:
    branches: [main]

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Catalog audit (DE↔EN parity, _pending_review check)
        run: node scripts/i18n-audit.mjs --report-only

      - name: ESLint i18n rules (no-raw-jsx-text + no-raw-toast-arg, error-level)
        run: |
          # Both rules are configured at error-level in eslint.config.js.
          # Other pre-existing TS lint errors are out of scope; we grep for
          # i18n-rule violations specifically and fail only on those.
          npm run lint > /tmp/lint.log 2>&1 || true
          violations=$(grep -cE "i18n/(no-raw-jsx-text|no-raw-toast-arg)" /tmp/lint.log || true)
          if [ "$violations" != "0" ]; then
            echo "::error::Found $violations i18n rule violations:"
            grep -E "i18n/(no-raw-jsx-text|no-raw-toast-arg)" /tmp/lint.log | head -50
            exit 1
          fi
          echo "✓ Zero i18n violations"

      - name: Regenerate screen inventory
        run: node scripts/generate-screen-inventory.mjs

      - name: Inventory drift check
        run: |
          if ! git diff --exit-code docs/SCREEN_INVENTORY.md; then
            echo "::error::docs/SCREEN_INVENTORY.md is out of date. Run 'npm run i18n:inventory' and commit the result."
            exit 1
          fi
