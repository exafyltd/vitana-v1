name: i18n check

# Wave 1: warn-only. Reports leaks and catalog drift but does NOT block PRs.
# Wave 2 graduates the toast-args lint to error.
# Wave 6 graduates the audit and lint to fully blocking.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/i18n-*'
      - 'scripts/generate-screen-inventory.mjs'
      - 'scripts/split-i18n.mjs'
      - 'eslint-rules/**'
      - 'eslint.config.js'
      - 'docs/SCREEN_INVENTORY.md'
      - '.github/workflows/i18n-check.yml'
      # VTID-03657: the locale-chunking guard reads the BUILD, so the file that
      # decides the chunking has to be able to trigger it. Deleting the
      # manualChunks rule touches nothing under src/, and without these two
      # entries the one check that would catch it never runs.
      - 'vite.config.ts'
      - 'scripts/check-locale-chunking.mjs'
      # VTID-03663: `scripts/i18n-*` above does NOT match this filename, so
      # without its own entry an edit to the guard could not trigger the guard.
      # Same shape as VTID-03659 — the file whose edit causes the regression has
      # to be able to trigger the thing that observes it.
      - 'scripts/check-i18n-subscriptions.mjs'
  push:
    branches: [main]

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Catalog audit (DE↔EN parity, _pending_review check)
        run: node scripts/i18n-audit.mjs --report-only

      # VTID-03657 — a switch to any non-German locale must cost ONE request.
      #
      # `import.meta.glob` without `eager` emits a chunk per FILE, so before the
      # manualChunks rule each locale shipped as ~104 chunks and `ensureCatalog`
      # awaited all of them before merging any. Choosing Spanish meant 104
      # fetches before one Spanish word appeared — which is what "only English
      # and German switch instantly" actually was.
      #
      # Checked against the emitted bundle rather than the config, because the
      # config states intent and the chunks are the fact. This is the only check
      # that can see the regression at all: removing the rule breaks no test,
      # changes no rendered string, and shows up solely as the UI feeling slow.
      - name: Locale chunking (one chunk per lazy locale, de stays eager)
        run: |
          npm run build
          node scripts/check-locale-chunking.mjs

      # VTID-03663 — a React.memo'd component that renders catalog strings must
      # subscribe to the locale.
      #
      # LanguageProvider cascades a re-render through its subtree on a language
      # change, which covers 613 of the 614 components that render t()/lookup()
      # without subscribing. React.memo is the one thing that stops the cascade:
      # it bails out on shallow-equal props, and the locale is not a prop. Such a
      # component renders its strings once and never looks again, leaving the
      # page in two languages at once.
      #
      # Nothing else can catch it: nothing throws, no key is missing, no test
      # fails, coverage is 100%, and the FIRST language a user picks looks
      # perfect — it only breaks on the second.
      - name: i18n subscriptions (memo'd components must subscribe to the locale)
        run: node scripts/check-i18n-subscriptions.mjs

      # VTID-03519. The other checks here can only see FILES. This one covers
      # the surface none of them can: DB-backed content. A locale that is `ga`
      # in the picker but absent from `supported_locales` is not merely
      # untranslated — it is unseedable (the FK rejects the rows), so the
      # Navigator and My Journey render German inside an otherwise translated
      # UI. es/sr/fr were all in exactly that state when this was added.
      #
      # No secrets: `supported_locales` is world-readable by design, and the
      # publishable key lives in the tracked .env.
      - name: Locale registry parity (picker ↔ supported_locales)
        run: node scripts/check-locale-registry.mjs

      # NO LANGUAGE LEFT BEHIND — the invariant half of I18N-PROPAGATE.
      #
      # Fails when any shipping locale is stale relative to the source it was
      # translated from. On a PR that edits src/i18n/de/**, this is RED until
      # I18N-PROPAGATE has pushed the other languages into the same PR, so a
      # German-only change cannot merge and leave 19 languages behind.
      #
      # This is deliberately a hard gate rather than a warning. The failure it
      # prevents is invisible by construction: a stale translation is still a
      # present key, so coverage reports 100% and nothing else notices. es/sr
      # sat two months behind exactly that way.
      - name: No language left behind (source freshness)
        run: node scripts/i18n-stamp-source.mjs --check-all

      # Brand voice is informal in every language. Each locale has its OWN
      # rule cross-checked against another language, because a pattern tuned
      # on one language does not transfer — see the script header for the
      # measured false-positive rates that forced that design.
      - name: Formal-register guard (du / tu / ti / ты / ty)
        run: node scripts/i18n-register-check.mjs --all

      - name: Long-word guard (DE compound-word overflow)
        # Fails the build if any DE catalog value contains a word >= 22
        # chars. Auto-fix via the i18n-long-words workflow (Gemini-driven
        # hyphenation at natural compound boundaries) or hand-edit the shard.
        run: node scripts/i18n-long-words.mjs --locale=de --check-only --max-word-length=22

      - name: ESLint i18n rule (no-raw-jsx-text, warn-level in Wave 1)
        run: npm run lint -- --quiet || echo "lint warnings noted; not blocking in Wave 1"

      - name: Regenerate screen inventory
        run: node scripts/generate-screen-inventory.mjs

      - name: Inventory drift check
        run: |
          if ! git diff --exit-code docs/SCREEN_INVENTORY.md; then
            echo "::warning::docs/SCREEN_INVENTORY.md is out of date. Run 'npm run i18n:inventory' and commit the result."
          fi
