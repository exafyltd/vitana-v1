name: Apply post notification deep-link migration

# Applies supabase/migrations/20260625000000_post_notification_deeplink.sql to the
# live Supabase project via the Management API query endpoint using the existing
# SUPABASE_ACCESS_TOKEN secret. Idempotent (CREATE OR REPLACE only), safe to re-run.
# Points like/comment notification data.url at the single-post route /post/<source>/<id>.
#
# Triggers:
#   - Auto:   push to main that touches the migration file or this workflow.
#   - Manual: Actions tab -> "Run workflow".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260625000000_post_notification_deeplink.sql'
      - '.github/workflows/apply-post-notification-deeplink-migration.yml'

concurrency:
  group: apply-post-notification-deeplink-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: inmkhvwdcuyhnxkgfvsb
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1
          fi
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = open('supabase/migrations/20260625000000_post_notification_deeplink.sql').read()
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          try:
              r = urllib.request.urlopen(req)
              print('Apply OK, status', r.status)
              print((r.read().decode() or '[]')[:1000])
          except urllib.error.HTTPError as e:
              print('Apply FAILED, HTTP', e.code)
              print(e.read().decode())
              raise SystemExit(1)
          PY

      - name: Verify the four functions deep-link to /post/
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          ref = os.environ['PROJECT_REF']
          tok = os.environ['SUPABASE_ACCESS_TOKEN']
          sql = ("select count(*)::int as n from pg_proc where proname in "
                 "('notify_on_profile_post_like','notify_on_profile_post_comment',"
                 "'notify_on_media_upload_like','notify_on_media_upload_comment') "
                 "and prosrc like '%/post/%';")
          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json',
                       'User-Agent': 'Mozilla/5.0 (vitana-ci) supabase-management-api'},
              method='POST',
          )
          r = urllib.request.urlopen(req)
          body = r.read().decode()
          print('Verify:', body)
          rows = json.loads(body or '[]')
          n = (rows[0] if rows else {}).get('n', 0)
          if n != 4:
              raise SystemExit(f"::error::Expected 4 deep-linked functions, found {n}")
          print('Verify OK: all 4 functions deep-link to /post/.')
          PY
