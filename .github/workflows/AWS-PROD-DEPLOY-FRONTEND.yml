# AWS-PROD-DEPLOY-FRONTEND — build the community app with the CANONICAL
# GCP production gateway baked in, push to ECR, and roll the AWS
# Production (DR) ECS service (VTID-03409).
#
# AWS twin of AWS-STAGE-DEPLOY-FRONTEND.yml, but for the parallel/DR
# production stack (vitana-community-app-awsdr), not AWS staging
# (vitana-community-app). GCP Cloud Run remains the canonical production
# for the frontend too — this workflow ships an AWS-hosted copy of the
# SAME production app, pointed at the SAME canonical gateway
# (gateway.vitanaland.com), matching how AWS-DR gateway (VTID-03398)
# shares GCP prod's Supabase project rather than diverging.
#
# Design choices:
# - workflow_dispatch ONLY, with a REQUIRED `reason` input — mirrors
#   AWS-PROD-DEPLOY-GATEWAY.yml (VTID-03398) and CLAUDE.md's staging-first
#   model: auto-deploy is for staging, prod is a deliberate action.
# - Vite bakes VITE_GATEWAY_BASE at BUILD time (this is a static SPA
#   served by nginx — there is no runtime env var to flip later), so the
#   .env.production write step is the one place that determines which
#   backend the shipped bundle talks to. Getting this wrong is exactly
#   the defect AWS-STAGE-DEPLOY-FRONTEND.yml's own header comment warns
#   about, just in the other direction (prod bundle should NEVER bake a
#   staging/preview URL).
# - Post-deploy verification asserts the LIVE bundle contains
#   "gateway.vitanaland.com" (the prod host) and explicitly checks it does
#   NOT contain "preview-aws-gateway.vitanaland.com" (the AWS staging
#   host) — the failure mode this guards against is a copy-paste of the
#   staging workflow's default shipping to prod silently.
#
# Required repository secrets (inherited from the existing AWS staging
# pipeline for now — same IAM user, same account/region already scoped to
# this repo; see AWS-STAGE-DEPLOY-FRONTEND.yml. A dedicated GitHub-OIDC
# deploy role, like the one built for gateway under VTID-03398, is the
# natural hardening follow-up so prod frontend deploys don't share
# credentials with staging deploys — not done here to avoid a second
# round of IAM-admin-elevation for this pass):
#   AWS_STAGING_ACCESS_KEY_ID / AWS_STAGING_SECRET_ACCESS_KEY

name: AWS Prod Deploy Frontend (ECS, DR)

on:
  # Callable by DEPLOY.yml so the documented "deploy the frontend to
  # production" action actually reaches production (VTID-03483).
  # vitanaland.com is served by this ECS service, not by Cloud Run, so a
  # Cloud-Run-only deploy leaves users on the previous build while every
  # status check reports success.
  workflow_call:
    inputs:
      reason:
        description: 'Reason for this AWS production frontend deploy — required'
        required: true
        type: string
      commit_sha:
        description: 'Exact commit to build. Empty → the calling ref.'
        required: false
        default: ''
        type: string
      gateway_url:
        required: false
        default: 'https://gateway.vitanaland.com'
        type: string
      frontend_url:
        required: false
        default: 'https://dr-app.vitanaland.com'
        type: string
      apex_url:
        # VTID-04989: the members' host. It is fronted by the dashboard-only
        # Cloudflare Worker `vitanaland-proxy`, so its cache behaviour is
        # proven by the post-deploy probe below, not read from a repo.
        required: false
        default: 'https://vitanaland.com'
        type: string
      aws_region:
        required: false
        default: 'eu-central-1'
        type: string
      ecr_repository:
        required: false
        default: 'vitana/community-app'
        type: string
      ecs_cluster:
        required: false
        default: 'Vitana-ECS-Cluster'
        type: string
      ecs_service:
        required: false
        default: 'vitana-community-app-awsdr'
        type: string
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for this AWS production (DR) frontend deploy — required'
        required: true
      commit_sha:
        description: 'Exact commit SHA to build. Empty → main HEAD.'
        required: false
        default: ''
      gateway_url:
        description: 'Gateway base URL to bake into the bundle (canonical GCP prod by default)'
        required: false
        default: 'https://gateway.vitanaland.com'
      frontend_url:
        description: 'Public frontend URL used for post-deploy verification'
        required: false
        default: 'https://dr-app.vitanaland.com'
      apex_url:
        description: 'Members host probed for the rollout guarantees (VTID-04989)'
        required: false
        default: 'https://vitanaland.com'
      aws_region:
        description: 'AWS region'
        required: false
        default: 'eu-central-1'
      ecr_repository:
        description: 'ECR repository name for the frontend image'
        required: false
        default: 'vitana/community-app'
      ecs_cluster:
        description: 'ECS cluster name'
        required: false
        default: 'Vitana-ECS-Cluster'
      ecs_service:
        description: 'ECS service name'
        required: false
        default: 'vitana-community-app-awsdr'

permissions:
  contents: read

concurrency:
  group: aws-prod-deploy-frontend
  cancel-in-progress: false

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    env:
      GATEWAY_URL: ${{ inputs.gateway_url }}
      FRONTEND_URL: ${{ inputs.frontend_url }}
      TARGET_AWS_REGION: ${{ inputs.aws_region }}
      ECR_REPOSITORY: ${{ inputs.ecr_repository }}
      ECS_CLUSTER: ${{ inputs.ecs_cluster }}
      ECS_SERVICE: ${{ inputs.ecs_service }}
      DEPLOY_REASON: ${{ inputs.reason }}
    steps:
      # Build the exact commit the caller pinned (DEPLOY.yml passes the same
      # commit_sha it deploys to Cloud Run, so both stacks ship one build);
      # empty → whatever ref this run was started on.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || github.sha }}

      - name: Write .env.production with the canonical prod gateway URL
        run: |
          cat > .env.production <<EOF
          # Generated by AWS-PROD-DEPLOY-FRONTEND.yml — do not commit.
          VITE_GATEWAY_BASE=${{ env.GATEWAY_URL }}
          VITE_GATEWAY_URL=${{ env.GATEWAY_URL }}/api/v1
          VITE_APP_VERSION=$(git rev-parse --short=12 HEAD)
          EOF
          sed 's/=.*/=<value>/' .env.production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_STAGING_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_STAGING_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.TARGET_AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Preflight — verify ECR repo + ECS service exist, and target is NOT staging
        run: |
          set -e
          if [ "${{ env.ECS_SERVICE }}" = "vitana-community-app" ]; then
            echo "::error::Refusing to deploy — 'vitana-community-app' is the AWS STAGING service. This workflow targets 'vitana-community-app-awsdr' (prod DR) only."
            exit 1
          fi
          if ! aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY }}" >/dev/null 2>&1; then
            echo "::error::ECR repository '${{ env.ECR_REPOSITORY }}' not found."
            exit 1
          fi
          if ! aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}" \
               --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            echo "::error::ECS service '${{ env.ECS_SERVICE }}' not ACTIVE in cluster '${{ env.ECS_CLUSTER }}'."
            exit 1
          fi

      # VTID-04949 (plan D1): record what production runs BEFORE this deploy
      # touches the service, so a failed post-deploy check can put it back.
      # Read-only. Same pattern as the gateway (VTID-04647).
      - name: Capture rollback target (task definition + bundle live before this deploy)
        id: prev
        run: |
          set -e
          PREV_ARN=$(aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' --output text)
          if [ -z "$PREV_ARN" ] || [ "$PREV_ARN" = "None" ]; then
            echo "::error::Could not read the live task definition; refusing to deploy without a rollback target."
            exit 1
          fi
          PREV_IMAGE=$(aws ecs describe-task-definition --task-definition "$PREV_ARN" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)
          PREV_BUNDLE=$(curl -s "${{ env.FRONTEND_URL }}/" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
          echo "arn=$PREV_ARN" >> "$GITHUB_OUTPUT"
          echo "image=$PREV_IMAGE" >> "$GITHUB_OUTPUT"
          echo "bundle=$PREV_BUNDLE" >> "$GITHUB_OUTPUT"
          echo "Rollback target: $PREV_ARN ($PREV_IMAGE, serving $PREV_BUNDLE)"

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -e
          # VTID-04908: tag the image with the commit that was checked out and
          # built (the same expression VITE_APP_VERSION uses), never GITHUB_SHA —
          # on a pinned dispatch GITHUB_SHA is the dispatch ref's HEAD, not the
          # code inside the image.
          BUILT_COMMIT="$(git rev-parse HEAD)"
          if [ -n "$REQUESTED_SHA" ]; then
            WANT="$(printf '%s' "$REQUESTED_SHA" | tr '[:upper:]' '[:lower:]')"
            if ! printf '%s' "$WANT" | grep -Eq '^[0-9a-f]{7,40}$'; then
              echo "::error::commit_sha '$REQUESTED_SHA' is not a commit id (need at least 7 hex characters)."
              exit 1
            fi
            case "$BUILT_COMMIT" in
              "$WANT"*) ;;
              *) echo "::error::Checked-out commit $BUILT_COMMIT does not match the requested commit_sha $WANT — refusing to push."; exit 1 ;;
            esac
          fi
          echo "Built commit: $BUILT_COMMIT (dispatch ref: $GITHUB_SHA)"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          IMAGE="$REGISTRY/${{ env.ECR_REPOSITORY }}:awsdr-$SHORT_SHA"
          docker build -t "$IMAGE" -t "$REGISTRY/${{ env.ECR_REPOSITORY }}:awsdr-latest" .
          docker push "$IMAGE"
          docker push "$REGISTRY/${{ env.ECR_REPOSITORY }}:awsdr-latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "built_commit=$BUILT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE"

      - name: Register task-definition revision + roll the service
        id: roll
        run: |
          set -e
          IMAGE="${{ steps.build.outputs.image }}"
          TD_ARN=$(aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' --output text)
          echo "Current task definition: $TD_ARN"
          NEW_DEF=$(aws ecs describe-task-definition --task-definition "$TD_ARN" --query taskDefinition \
            | jq --arg IMG "$IMAGE" '
                .containerDefinitions[0].image = $IMG
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                      .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
                # VTID-04854: never clone forward a ref to an Aurora-managed
                # secret (rds!cluster-…). vitana-aurora-prod no longer has a
                # managed master secret, so the ref fails every new task with
                # ResourceInitializationError (ResourceNotFoundException) — the
                # same failure VTID-04849 fixed for the gateway. The SPA never
                # reads a database secret.
                | .containerDefinitions |= map(
                    if .secrets then
                      (.secrets |= map(select((.valueFrom // "") | test(":secret:rds!") | not)))
                      | (if (.secrets | length) == 0 then del(.secrets) else . end)
                    else . end)')
          echo "Secrets on the new revision: $(echo "$NEW_DEF" | jq -c '[.containerDefinitions[].secrets // [] | .[].name]')"
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $NEW_ARN"
          aws ecs update-service --cluster "${{ env.ECS_CLUSTER }}" --service "${{ env.ECS_SERVICE }}" \
            --task-definition "$NEW_ARN" >/dev/null
          echo "Waiting for service to stabilize (up to ~10 min)…"
          aws ecs wait services-stable --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}"
          echo "Service stable on $NEW_ARN"

      - name: Post-deploy verify — live bundle must bake the PROD gateway, never staging
        id: verify
        env:
          PREV_IMAGE: ${{ steps.prev.outputs.image }}
          PREV_BUNDLE: ${{ steps.prev.outputs.bundle }}
          NEW_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -e
          FRONTEND="${{ env.FRONTEND_URL }}"
          GATEWAY_HOST=$(echo "${{ env.GATEWAY_URL }}" | sed -E 's|https?://||; s|/.*||')
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /tmp/index.html -w "%{http_code}" "$FRONTEND/" || echo 000)
            [ "$CODE" = "200" ] && break
            echo "Attempt $i: HTTP $CODE — retry in 10s"; sleep 10
          done
          [ "$CODE" = "200" ] || { echo "::error::$FRONTEND/ did not answer 200"; exit 1; }
          # VTID-04989: the entry bundle specifically — /boot-recover.js is now
          # the first script on the page.
          BUNDLE=$(grep -oE 'src="/assets/index-[^"]+\.js"' /tmp/index.html | head -1 | sed 's/src="//;s/"//')
          [ -n "$BUNDLE" ] || { echo "::error::no JS bundle reference found in index.html"; exit 1; }
          # VTID-04989: record what the CDN returned. A 404 cached at the
          # runner's Cloudflare location (left by an old task during the
          # rollout into the no-store fix) is not the deployed build; confirm
          # against the origin with a cache-busting query and say which.
          FETCH=$(curl -s -o /tmp/bundle.js -D /tmp/bundle.h -w "%{http_code}" "$FRONTEND$BUNDLE" || echo 000)
          CFS=$(grep -i '^cf-cache-status:' /tmp/bundle.h | tr -d '\r' | awk '{print $2}' || true)
          echo "Bundle $BUNDLE: HTTP $FETCH, cf-cache-status=${CFS:-none}"
          if [ "$FETCH" != "200" ]; then
            echo "::warning::$FRONTEND$BUNDLE answered $FETCH through the CDN (cf-cache-status=${CFS:-none}) — checking the origin directly."
            FETCH=$(curl -s -o /tmp/bundle.js -w "%{http_code}" "$FRONTEND$BUNDLE?deploy-verify=$GITHUB_RUN_ID" || echo 000)
            echo "Bundle $BUNDLE?deploy-verify=$GITHUB_RUN_ID: HTTP $FETCH"
            [ "$FETCH" = "200" ] || { echo "::error::$BUNDLE is not served by the deployed build (HTTP $FETCH)"; exit 1; }
          fi
          if ! grep -q "$GATEWAY_HOST" /tmp/bundle.js; then
            echo "::error::Live bundle does NOT contain $GATEWAY_HOST — the frontend is still pointing elsewhere. Check ALB host rule / CDN cache / task rollout."
            exit 1
          fi
          if grep -q "preview-aws-gateway.vitanaland.com" /tmp/bundle.js; then
            echo "::error::Live PROD bundle bakes the AWS STAGING gateway URL — wrong build shipped to prod. Aborting (deploy already happened; investigate immediately)."
            exit 1
          fi
          echo "✓ Live bundle bakes $GATEWAY_HOST (prod), no staging URL present"
          # VTID-04949: a green rollout is not proof the new build is what
          # members get. Sample the served bundle 10 times (a rolling deploy
          # serves old and new side by side for a while); every sample must
          # agree, and must differ from the bundle live before the deploy
          # unless this deploy re-shipped the same image.
          SEEN=""
          for i in $(seq 1 10); do
            B=$(curl -s "$FRONTEND/?s=$i" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
            SEEN="$SEEN $B"; sleep 6
          done
          UNIQ=$(echo $SEEN | tr ' ' '\n' | sort -u | grep -c . || true)
          LAST=$(echo $SEEN | tr ' ' '\n' | tail -1)
          [ "$UNIQ" = "1" ] || { echo "::error::Samples disagree after the rollout settled:$SEEN"; exit 1; }
          if [ "$NEW_IMAGE" != "$PREV_IMAGE" ] && [ -n "$PREV_BUNDLE" ] && [ "$LAST" = "$PREV_BUNDLE" ]; then
            echo "::error::Production still serves the pre-deploy bundle ($PREV_BUNDLE) — the new build is not live."
            exit 1
          fi
          echo "✓ 10/10 samples serve $LAST (before: ${PREV_BUNDLE:-unknown})"
          {
            echo "## AWS Production (DR) frontend deploy"
            echo "- Image: \`${{ steps.build.outputs.image }}\`"
            echo "- Built commit: \`${{ steps.build.outputs.built_commit }}\`"
            echo "- Dispatch ref: \`$GITHUB_SHA\`"
            echo "- Gateway baked in: \`${{ env.GATEWAY_URL }}\`"
            echo "- Verified live at: $FRONTEND"
            echo "- Reason: ${{ env.DEPLOY_REASON }}"
            echo "- VTID: VTID-03409"
          } >> "$GITHUB_STEP_SUMMARY"

      # VTID-04949 (plan D1): automatic rollback, same contract as the gateway
      # (VTID-04647). Runs when the service was rolled and a later step failed.
      # Re-points the service at the task definition captured before the deploy
      # and waits until production serves the previous bundle again. Kill
      # switch: repository variable PROD_AUTO_ROLLBACK_DISABLED=true. The job
      # still fails: a rolled-back deploy is not a successful deploy.
      - name: Roll back to the previous task definition
        id: rollback
        if: ${{ failure() && steps.prev.outputs.arn != '' && steps.roll.outcome != 'skipped' && vars.PROD_AUTO_ROLLBACK_DISABLED != 'true' }}
        env:
          PREV_ARN: ${{ steps.prev.outputs.arn }}
          PREV_BUNDLE: ${{ steps.prev.outputs.bundle }}
        run: |
          set -e
          echo "::warning::Post-deploy checks failed — rolling back to $PREV_ARN"
          aws ecs update-service --cluster "${{ env.ECS_CLUSTER }}" --service "${{ env.ECS_SERVICE }}" \
            --task-definition "$PREV_ARN" >/dev/null
          aws ecs wait services-stable --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}"
          LIVE=""
          for i in 1 2 3 4 5 6; do
            LIVE=$(curl -s "${{ env.FRONTEND_URL }}/?r=$i" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 || true)
            if [ -z "$PREV_BUNDLE" ] || [ "$LIVE" = "$PREV_BUNDLE" ]; then break; fi
            sleep 15
          done
          echo "Rolled back: service on $PREV_ARN, serving '$LIVE' (expected '${PREV_BUNDLE:-unknown}')"
          echo "## ⚠️ Rolled back to $PREV_ARN — serving \`$LIVE\`" >> "$GITHUB_STEP_SUMMARY"

      # VTID-04989 — a missing asset must never be cached on the members' host
      # (apex, through the vitanaland-proxy Worker). Placed AFTER the rollback
      # step and only on success: a CDN/Worker cache setting is not a broken
      # build, so this check turns the run red without reverting a good
      # deploy. Read-only GETs of public files, run by the workflow (rule 48),
      # never from a session.
      - name: Post-deploy verify — apex never caches a missing asset (VTID-04989)
        if: success()
        run: |
          set -e
          # The `|| default` keeps the check alive for any caller that does
          # not pass apex_url (a dispatch from before this input existed
          # passed "" and the script stopped at its own argument check).
          scripts/ci/verify-rollout-guarantees.sh "${{ inputs.apex_url || 'https://vitanaland.com' }}" "prod-${GITHUB_RUN_ID}"
